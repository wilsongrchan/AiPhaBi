<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取碼進度 · 愛發筆</title>
<style>
  :root{
    --bg:#faf9f7; --card:#fff; --ink:#1c1a17; --muted:#7c7568; --faint:#b3aa9a; --line:#e3ded4;
    --grid:#ece5d8; --accent:#b4531f; --accent-soft:rgba(180,83,31,.12); --s2:#3a6ea5; --s2-soft:rgba(58,110,165,.12);
    --s3:#5c8a3a; --s4:#7d5ba6; --sum:#1c1a17;
    --bar:#d98324; --warn:#d98324; --ghost:#cfc8bb;
    --shadow:0 1px 2px rgba(60,42,20,.05),0 14px 40px -20px rgba(60,42,20,.26);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16150f; --card:#1f1e18; --ink:#ece7dc; --muted:#9a9284; --faint:#6b6455; --line:#33312a;
      --grid:#28251e; --accent:#e0894f; --accent-soft:rgba(224,137,79,.15); --s2:#5c9bd6; --s2-soft:rgba(92,155,214,.16);
      --s3:#82b85c; --s4:#a688d1; --sum:#ece7dc;
      --bar:#e0a95c; --warn:#e0a95c; --ghost:#4a463c;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 46px -22px rgba(0,0,0,.7); }
  }
  :root[data-theme="light"]{ --bg:#faf9f7; --card:#fff; --ink:#1c1a17; --muted:#7c7568; --faint:#b3aa9a;
    --line:#e3ded4; --grid:#ece5d8; --accent:#b4531f; --accent-soft:rgba(180,83,31,.12); --s2:#3a6ea5; --s2-soft:rgba(58,110,165,.12);
    --s3:#5c8a3a; --s4:#7d5ba6; --sum:#1c1a17;
    --bar:#d98324; --warn:#d98324; --ghost:#cfc8bb; --shadow:0 1px 2px rgba(60,42,20,.05),0 14px 40px -20px rgba(60,42,20,.26); }
  :root[data-theme="dark"]{ --bg:#16150f; --card:#1f1e18; --ink:#ece7dc; --muted:#9a9284; --faint:#6b6455;
    --line:#33312a; --grid:#28251e; --accent:#e0894f; --accent-soft:rgba(224,137,79,.15); --s2:#5c9bd6; --s2-soft:rgba(92,155,214,.16);
    --s3:#82b85c; --s4:#a688d1; --sum:#ece7dc;
    --bar:#e0a95c; --warn:#e0a95c; --ghost:#4a463c; --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 46px -22px rgba(0,0,0,.7); }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,"PingFang TC","Helvetica Neue",system-ui,sans-serif;}
  .num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
  nav{display:flex;gap:5px;flex-wrap:wrap;max-width:900px;margin:0 auto;padding:14px 20px 0;}
  nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:4px 9px;border:1px solid var(--line);border-radius:7px;}
  nav a.on{color:#fff;background:var(--accent);border-color:var(--accent);}
  .wrap{max-width:900px;margin:0 auto;padding:18px 20px 60px;display:flex;flex-direction:column;gap:24px;}

  header{display:flex;flex-direction:column;gap:4px;}
  .eyebrow{font-size:12px;letter-spacing:.28em;color:var(--accent);font-weight:600;}
  h1{margin:2px 0 0;font-weight:400;line-height:.9;display:flex;align-items:baseline;gap:.16em;}
  h1 .big{font-size:clamp(52px,12vw,96px);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
  h1 .unit{font-size:clamp(22px,5vw,36px);color:var(--accent);font-family:"Songti TC","Songti SC",serif;}
  .lede{margin:4px 0 0;color:var(--muted);max-width:52ch;font-size:14px;}
  .lede b{color:var(--ink);font-weight:600;}
  .lede .raw{color:var(--s2);font-weight:600;}
  .legend{display:inline-flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .legend button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:9px;
    background:var(--card);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .legend button .sw{width:11px;height:11px;border-radius:3px;display:inline-block;opacity:.3;transition:opacity .12s;}
  .legend button.on{color:var(--ink);border-color:currentColor;}
  .legend button.on .sw{opacity:1;}
  #chartlegend{margin-top:0;}
  #chartlegend button.sumbtn{font-weight:600;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:clamp(14px,3vw,24px);}
  .plabel{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0 2px 2px;}
  .plabel .r{letter-spacing:.02em;color:var(--faint);}
  figure{margin:0;position:relative;}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:none;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
    display:flex;flex-direction:column;gap:3px;}
  .tile .k{font-size:11px;letter-spacing:.13em;color:var(--muted);}
  .tile .v{font-size:24px;color:var(--ink);line-height:1.1;}
  .tile .v small{font-size:12px;color:var(--muted);margin-left:4px;letter-spacing:0;}
  .tile.hl .v{color:var(--accent);}
  .tile.off{opacity:.4;}
  /* 官方字表覆蓋率：「取到哪裡算完成」用這個講，不是用碼表總字數 */
  .std{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:16px 18px;margin:0 0 18px;}
  .stdhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:0 0 14px;cursor:pointer;user-select:none;}
  .std h2{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0;font-weight:600;}
  .stdhead .chev{font-size:11px;color:var(--faint);white-space:nowrap;}
  .stdhead:hover .chev{color:var(--accent);}
  /* 收合：只剩兩條長條，一個字都不留。整張卡片可點，點了就展開回來。 */
  .std.collapsed{padding:11px 18px;cursor:pointer;}
  .std.collapsed .stdhead,.std.collapsed .sthead,.std.collapsed .stfoot{display:none;}
  .std.collapsed .strow{margin:0 0 6px;}
  .std.collapsed .strow:last-child{margin-bottom:0;}
  .std.collapsed .stbar{height:7px;}
  .strow{margin:0 0 16px;}
  .strow:last-child{margin-bottom:0;}
  .sthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 7px;flex-wrap:wrap;}
  .stname{font-size:14px;color:var(--ink);}
  .stname small{color:var(--faint);font-size:11px;margin-left:7px;letter-spacing:0;}
  .stnum{font-size:13px;color:var(--muted);white-space:nowrap;}
  .stnum b{color:var(--accent);font-weight:600;font-size:16px;}
  .stbar{height:9px;border-radius:5px;background:var(--grid);overflow:hidden;}
  .stbar i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .3s;}
  .strow.b .stbar i{background:var(--s2);} .strow.b .stnum b{color:var(--s2);}
  .stfoot{margin-top:7px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;}
  .stfoot a{color:var(--s2);text-decoration:none;}
  .stfoot a:hover{text-decoration:underline;}
  .stdone{color:var(--s3);font-weight:600;}
  .tile.off .v{color:var(--muted);}
  .tile.sum{border-color:var(--accent);border-width:1.5px;}
  .tile .view{font-size:11px;color:var(--accent);text-decoration:none;margin-top:2px;display:inline-block;}
  .tile .view:hover{text-decoration:underline;}

  footer{color:var(--faint);font-size:12px;text-align:center;line-height:1.7;}

  .tip{position:fixed;pointer-events:none;z-index:20;opacity:0;transform:translateY(4px);
    transition:opacity .12s,transform .12s;background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;box-shadow:var(--shadow);font-size:13px;min-width:128px;}
  .tip.on{opacity:1;transform:translateY(0);}
  .tip .td{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
  .tip .row{display:flex;justify-content:space-between;gap:14px;}
  .tip .row .lab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;}
  .tip .row .lab i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .tip .row .val{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;}

  .grid-line{stroke:var(--grid);stroke-width:1;}
  .zero-line{stroke:var(--line);stroke-width:1;}
  .tick{fill:var(--faint);font:500 11px ui-monospace,Menlo,monospace;}
  .xtick{fill:var(--muted);font:500 10px ui-monospace,Menlo,monospace;}
  .cum-area{fill:var(--accent-soft);}
  .cum-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
  .cum-line.dash{stroke-dasharray:5 4;opacity:.8;}
  .dot{fill:var(--card);stroke:var(--accent);stroke-width:2;}
  .dot-last{fill:var(--accent);stroke:var(--card);stroke-width:2.5;}
  .bar{fill:var(--bar);}
  .bar-neg{fill:var(--faint);}
  .bar-now{fill:var(--bar);opacity:.5;}
  .cross{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:0;}
  .cross.on{opacity:.7;}
  .tianzi{stroke:var(--faint);stroke-dasharray:5 6;stroke-width:1;opacity:.3;fill:none;}
  .msg{color:var(--muted);font-size:14px;padding:30px 0;text-align:center;}
  @media (prefers-reduced-motion:reduce){.tip{transition:none;}}
</style>
</head>
<body>
<nav>
  <a href="/">字根表</a><a href="/annotate">逐字取碼</a><a href="/variants">兼容字型</a><a href="/stats">碼表分析</a><a href="/rules">取碼原則</a><a href="/short">簡碼</a><a href="/type">試打</a><a href="/progress" class="on">取碼進度</a>
</nav>
<div class="wrap">
  <header>
    <div class="eyebrow">愛發筆 AiPhaBi · 取碼進度</div>
    <h1><span class="big num" id="total">—</span><span class="unit">字</span></h1>
    <p class="lede" id="lede">讀取中…</p>
  </header>

  <div id="stdcard"></div>

  <div class="legend" id="chartlegend"></div>
  <div class="card" id="chartcard">
    <div class="plabel"><span>累計取碼（疊加）</span><span class="r" id="cumr"></span></div>
    <div class="plabel" style="margin-top:12px"><span>每天新增（疊加）</span><span class="r">依取碼提交</span></div>
    <figure><svg id="chart" viewBox="0 0 820 470" role="img" aria-label="逐日累計取碼曲線與每日新增長條圖。"></svg></figure>
  </div>

  <div class="stats" id="stats"></div>

  <footer>
    資料由 git 提交歷史即時重建（每個有取碼提交的日子）· 目前數字含尚未提交的取碼<br>
    愛發筆 · 自製形碼中文輸入法
  </footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const SVGNS='http://www.w3.org/2000/svg';
const mk=(n,a={})=>{const e=document.createElementNS(SVGNS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const W=820,H=470,padL=48,padR=30,cumTop=54,cumBot=250,dTop=306,dZero=430;

let PROG=null;

/* 繁體／簡體／傳承／日本漢字：同一組開關，同時控制下面的 tile 跟圖上要疊哪幾條帶；
   「加總」不是一條帶，只決定要不要在堆疊頂端描一條總計線。 */
const CAT_KEY='aiphabi-progress-cats';
let catOn={trad:true,simp:true,inherited:true,jp:false,sum:true};
try{Object.assign(catOn,JSON.parse(localStorage.getItem(CAT_KEY)||'{}'));}catch(e){}
function saveCats(){localStorage.setItem(CAT_KEY,JSON.stringify(catOn));}
const CATDEF=[
  {key:'trad',      name:'繁體字', col:'var(--accent)', s:'有對應簡體字，如 國魚雲'},
  {key:'simp',      name:'簡體字', col:'var(--s2)',      s:'簡體專屬，如 国鸟'},
  {key:'inherited', name:'傳承字', col:'var(--s3)',      s:'如人天后'},
  {key:'jp',        name:'日本漢字', col:'var(--s4)',    s:'新字体／國字，如県駅鉄'},
];

fetch('/api/progress').then(r=>r.json()).then(d=>{PROG=d; render();}).catch(e=>{
  $('#chartcard').innerHTML='<div class="msg">讀取進度失敗：'+e+'</div>';
  $('#lede').textContent='';
});
function render(){ if(PROG) draw(PROG); }

/* 舊的 catValue()／catNow() 拿掉了：那是折線圖時代用來算「勾選類別的聯集」的。
   改成疊加區域圖之後，聯集是堆疊本身的高度，由 bandVal() 保證各帶互斥。 */

/* 圖表正上方的小開關列：跟下面的 tile 是同一組 catOn 狀態，兩邊點哪個都同步。
   顏色 swatch 直接對應圖上線的顏色，一眼就知道哪條線是哪個類別。 */
function renderLegend(){
  const box=$('#chartlegend'); box.innerHTML='';
  const defs=[...CATDEF, {key:'sum',name:'加總',col:'var(--sum)'}];
  defs.forEach(c=>{
    const b=document.createElement('button');
    b.className=(catOn[c.key]?'on':'')+(c.key==='sum'?' sumbtn':'');
    b.title=c.key==='sum'?'在堆疊頂端加一條總計線（堆疊高度本來就是加總）':(CATDESC[c.key]||'');
    b.innerHTML=`<i class="sw" style="background:${c.col}"></i>${c.name}`;
    b.onclick=()=>{catOn[c.key]=!catOn[c.key];saveCats();render();};
    box.appendChild(b);
  });
}

function draw(data){
  renderLegend();
  renderStandards(data);
  const days=data.days||[];
  $('#total').textContent=data.totalUniq.toLocaleString();
  if(!days.length){
    $('#chartcard').innerHTML='<div class="msg">還沒有取碼提交紀錄。</div>';
    $('#lede').textContent='目前已取碼 '+data.totalUniq.toLocaleString()+' 字。';
    renderCats(data); return;
  }
  const first=days[0].date, d0=new Date(first);
  const off=ds=>Math.round((new Date(ds)-d0)/864e5);

  /* 疊加區域圖：一個類別一條「帶」，帶的厚度＝那個類別的字數，堆起來的頂端＝加總。
     帶一定要互斥，不然會重複算高度：trad∩simp（inter）與 jp⊂inherited 都得先扣掉。
     扣的方式跟 catValue() 的聯集邏輯逐項對齊，所以任何開關組合下，堆疊頂端都等於
     「加總」那個數字：
       繁體  trad - inter（只有簡體也開著時才扣，不然 inter 該算在繁體裡）
       簡體  simp（inter 已經在繁體那邊扣掉了，這裡收）
       傳承  inherited - jp（只有日漢也開著時才扣，不然日漢該算在傳承裡）
       日漢  jp
     實際資料裡 inter 一直是 0（沒有同時是簡體專屬又有繁簡對照的字），但照樣扣，
     免得哪天出現一個就悄悄多算一層。 */
  const STACK=['inherited','jp','trad','simp'];   /* 由下往上疊 */
  const bandVal=(d,k)=>
      k==='trad'      ? d.trad - (catOn.simp?d.inter:0)
    : k==='simp'      ? d.simp
    : k==='inherited' ? d.inherited - (catOn.jp?d.jp:0)
    :                   d.jp;
  const defOf=Object.fromEntries(CATDEF.map(c=>[c.key,c]));
  const keys=STACK.filter(k=>catOn[k]);
  if(!keys.length){
    $('#chartcard').innerHTML='<div class="msg">下面請至少勾選一個類別（繁體／簡體／傳承／日本漢字）。</div>';
    renderCats(data); return;
  }
  /* 「現在」那一格（含還沒提交的）：湊成跟 days 一樣的形狀，就能共用 bandVal。
     inter 現算：兩個字集合的交集大小。 */
  const simpNow=new Set(data.simpChars||[]);
  const nowDay={trad:(data.tradChars||[]).length, simp:data.totalSimp,
    inherited:(data.inheritedChars||[]).length, jp:data.totalJp,
    inter:(data.tradChars||[]).filter(c=>simpNow.has(c)).length};
  const lastDay=days[days.length-1];
  const uncommitted=STACK.some(k=>bandVal(nowDay,k)!==bandVal(lastDay,k));
  const rows=days.map((d,i)=>{
    const prev=i?days[i-1]:null;
    const vals={},adds={};
    for(const k of keys){ vals[k]=bandVal(d,k); adds[k]=prev?vals[k]-bandVal(prev,k):vals[k]; }
    return {x:off(d.date),date:d.date,label:d.date.slice(5),vals,adds,
            total:keys.reduce((s,k)=>s+vals[k],0)};
  });
  if(uncommitted){
    const prev=lastDay, vals={},adds={};
    for(const k of keys){ vals[k]=bandVal(nowDay,k); adds[k]=vals[k]-bandVal(prev,k); }
    rows.push({x:rows[rows.length-1].x+1,date:'現在',label:'現在',vals,adds,now:true,
               total:keys.reduce((s,k)=>s+vals[k],0)});
  }
  const dayMax=Math.max(1,...rows.map(p=>p.x));
  const cumMax=Math.max(200,Math.ceil(Math.max(...rows.map(p=>p.total))/300)*300);
  const addMax=Math.max(100,Math.ceil(Math.max(1,...rows.flatMap(p=>
    [keys.reduce((s,k)=>s+Math.max(0,p.adds[k]),0),
     -keys.reduce((s,k)=>s+Math.min(0,p.adds[k]),0)]))/100)*100);
  const x=v=>padL+v/dayMax*(W-padL-padR);
  const yc=v=>cumBot-v/cumMax*(cumBot-cumTop);
  const yd=v=>dZero-v/addMax*(dZero-dTop);

  const uniqCumAt=d=>d.total-d.simp;
  const uniqSeries=days.map((d,i)=>({date:d.date,
    add:i===0?uniqCumAt(d):uniqCumAt(d)-uniqCumAt(days[i-1])}));
  const best=uniqSeries.reduce((m,p)=>p.add>m.add?p:m,uniqSeries[0]);
  const unc=data.totalUniq-uniqCumAt(days[days.length-1]);
  $('#cumr').textContent='0 → '+data.totalUniq.toLocaleString()+' 字（不另計）';
  $('#lede').innerHTML=`第一筆取碼在 <b>${first}</b>，到現在共 <b>${data.totalUniq.toLocaleString()} 字</b>`+
    `（繁簡同字只算一個）；<span class="raw">另計 ${data.total.toLocaleString()} 條碼</span>。`+
    (unc>0?` 其中 <b>${unc}</b> 字還沒提交。`:'')+
    ` 圖表跟著下面的 tile 開關走。`;

  const svg=$('#chart'); svg.innerHTML='';
  const bxx={x:padL,y:cumTop,w:W-padL-padR,h:cumBot-cumTop};
  svg.appendChild(mk('rect',{x:bxx.x,y:bxx.y,width:bxx.w,height:bxx.h,rx:12,class:'tianzi'}));
  svg.appendChild(mk('line',{x1:bxx.x+bxx.w/2,y1:bxx.y,x2:bxx.x+bxx.w/2,y2:bxx.y+bxx.h,class:'tianzi'}));
  svg.appendChild(mk('line',{x1:bxx.x,y1:bxx.y+bxx.h/2,x2:bxx.x+bxx.w,y2:bxx.y+bxx.h/2,class:'tianzi'}));
  for(let i=0;i<=3;i++){const v=Math.round(cumMax*i/3);
    svg.appendChild(mk('line',{x1:padL,y1:yc(v),x2:W-padR,y2:yc(v),class:'grid-line'}));
    const t=mk('text',{x:padL-8,y:yc(v)+4,'text-anchor':'end',class:'tick'});t.textContent=v;svg.appendChild(t);}
  // 累計：疊加區域。先算出每條帶的上下緣（下緣＝前面所有帶的和）
  const upper={},lower={};
  {
    let acc=rows.map(()=>0);
    for(const k of keys){
      lower[k]=acc.slice();
      acc=acc.map((v,i)=>v+rows[i].vals[k]);
      upper[k]=acc.slice();
    }
  }
  const edge=arr=>rows.map((p,i)=>`${x(p.x)} ${yc(arr[i])}`).join(' L ');
  keys.forEach(k=>{
    const col=defOf[k].col;
    const back=rows.map((p,i)=>`${x(p.x)} ${yc(lower[k][i])}`).reverse().join(' L ');
    svg.appendChild(mk('path',{d:`M ${edge(upper[k])} L ${back} Z`,
      fill:col,'fill-opacity':.6}));
    // 上緣描一條細線，兩條帶之間才分得開（相鄰顏色接近時特別需要）
    svg.appendChild(mk('path',{d:'M '+edge(upper[k]),fill:'none',stroke:col,
      'stroke-width':1.5,'stroke-linejoin':'round'}));
  });
  // 「加總」不再是一條獨立的帶（堆疊頂端本來就是加總），改成頂端描一條線
  if(catOn.sum)
    svg.appendChild(mk('path',{d:'M '+rows.map(p=>`${x(p.x)} ${yc(p.total)}`).join(' L '),
      fill:'none',stroke:'var(--sum)','stroke-width':2.5,'stroke-linejoin':'round',
      'stroke-linecap':'round','stroke-opacity':.85}));
  // 還沒提交的那一格：畫一條虛線分隔，右邊那段是工作區現況、不是 git 歷史
  if(uncommitted){
    const bx=x(rows[rows.length-2].x);
    svg.appendChild(mk('line',{x1:bx,y1:cumTop,x2:bx,y2:dZero,stroke:'var(--faint)',
      'stroke-width':1,'stroke-dasharray':'4 4'}));
  }
  {
    const last=rows[rows.length-1];
    svg.appendChild(mk('circle',{cx:x(last.x),cy:yc(last.total),r:5,
      fill:'var(--sum)',stroke:'var(--card)','stroke-width':2}));
  }
  // 每日新增：同樣疊起來（正的往上疊、負的往下疊——改碼可能讓某類別當天變少）
  svg.appendChild(mk('line',{x1:padL,y1:dZero,x2:W-padR,y2:dZero,class:'zero-line'}));
  const slot=Math.min(20,(W-padL-padR)/(dayMax+2)), bw=Math.max(3,slot-3);
  rows.forEach(p=>{
    let up=0,dn=0;
    for(const k of keys){
      const v=p.adds[k]; if(!v) continue;
      const col=defOf[k].col;
      if(v>0){
        svg.appendChild(mk('rect',{x:x(p.x)-bw/2,y:yd(up+v),width:bw,
          height:Math.max(1,yd(up)-yd(up+v)),rx:1,fill:col,'fill-opacity':p.now?.5:.9}));
        up+=v;
      }else{
        svg.appendChild(mk('rect',{x:x(p.x)-bw/2,y:yd(dn),width:bw,
          height:Math.max(1,yd(dn+v)-yd(dn)),rx:1,fill:col,'fill-opacity':.4}));
        dn+=v;
      }
    }
  });
  // 日期軸：只畫間隔夠開的標籤（避免重疊）；一定保留最後一個（現在）。
  (()=>{const MIN=46, endX=x(rows[rows.length-1].x); let lastX=-1e9;
    rows.forEach((p,i)=>{const px=x(p.x), isEnd=i===rows.length-1;
      if(isEnd || (px-lastX>=MIN && endX-px>=MIN)){
        const t=mk('text',{x:px,y:dZero+22,'text-anchor':'middle',class:'xtick'});
        t.textContent=p.label;svg.appendChild(t);lastX=px;}});})();
  const cross=mk('line',{y1:cumTop,y2:dZero,class:'cross'});svg.appendChild(cross);

  // hover：由上往下列出各帶，最後給堆疊頂端的加總
  const tip=$('#tip'), xs=rows.map(p=>p.x);
  function show(ev){const cx=ev.clientX ?? ev.touches[0].clientX, cy=ev.clientY ?? ev.touches[0].clientY;
    const r=svg.getBoundingClientRect(), sx=(cx-r.left)/r.width*W, dq=(sx-padL)/(W-padL-padR)*dayMax;
    let xx=xs[0],bd=1e9;for(const q of xs){const dd=Math.abs(q-dq);if(dd<bd){bd=dd;xx=q;}}
    cross.setAttribute('x1',x(xx));cross.setAttribute('x2',x(xx));cross.classList.add('on');
    const p=rows.find(q=>q.x===xx);
    let html=`<div class="td">${p&&p.now?'現在（未提交）':'2026-'+(p?p.date.slice(5):'')}</div>`;
    if(p){
      /* 由上往下講，跟圖上的堆疊順序一致。傳承字那條在日漢也開著時是「扣掉日漢」
         之後的厚度，跟下面的 tile（傳承字全額）差 11 字，所以標題直接寫清楚。 */
      for(const k of [...keys].reverse()){
        const c=defOf[k], v=p.vals[k], a=p.adds[k];
        const nm=(k==='inherited'&&catOn.jp)?'傳承字（不含日漢）':c.name;
        html+=`<div class="row"><span class="lab"><i style="background:${c.col}"></i>${nm}</span>`+
          `<span class="val">${v.toLocaleString()} <small style="color:var(--muted)">${a>=0?'+':''}${a}</small></span></div>`;
      }
      const ta=keys.reduce((s,k)=>s+p.adds[k],0);
      html+=`<div class="row"><span class="lab"><i style="background:var(--sum)"></i>加總</span>`+
        `<span class="val">${p.total.toLocaleString()} <small style="color:var(--muted)">${ta>=0?'+':''}${ta}</small></span></div>`;
    }
    tip.innerHTML=html; tip.classList.add('on');
    const tw=tip.offsetWidth,th=tip.offsetHeight;let l=cx+16,t=cy-th-10;
    if(l+tw>innerWidth-8)l=cx-tw-16; if(t<8)t=cy+18; tip.style.left=l+'px';tip.style.top=t+'px';}
  function hide(){cross.classList.remove('on');tip.classList.remove('on');}
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',hide);

  const tiles=[
    {k:'不重複字',v:data.totalUniq.toLocaleString(),s:'＝繁體字＋傳承字',hl:true},
    {k:'所有漢字',v:data.total.toLocaleString(),s:''},
    {k:'最高單日',v:'+'+best.add,s:best.date.slice(5),hl:true},
    {k:'活躍天數',v:days.length,s:'天有提交'},
  ];
  const scb=$('#stats');scb.innerHTML='';
  tiles.forEach(t=>{const d=document.createElement('div');d.className='tile'+(t.hl?' hl':'');
    d.innerHTML=`<span class="k">${t.k}</span><span class="v num">${t.v}<small>${t.s}</small></span>`;
    scb.appendChild(d);});
  renderCats(data);
}

/* ---------- 官方字表覆蓋率 ----------
   「取碼取到哪裡算完成」講的是這兩條，不是碼表總字數——總字數裡混了粵語字、
   字根零件、日本漢字，不對應任何一份官方字表，講出去沒有意義。
   缺的字照字表原順序給（教育部表筆畫序、GB2312 一級拼音序），連去 /annotate
   就是照那個順序往下取。網址塞不下幾千個字，所以一次只帶 LINK_CAP 個。 */
const LINK_CAP=300;
const STD_KEY='aiphabi-progress-std-collapsed';
let stdCollapsed=localStorage.getItem(STD_KEY)==='1';
function renderStandards(data){
  const list=data.standards||[];
  const box=$('#stdcard');
  if(!list.length){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="std${stdCollapsed?' collapsed':''}" id="stdbox"${
      stdCollapsed?' title="展開官方字表覆蓋率"':''}>`+
    '<div class="stdhead"><h2>官方字表覆蓋率</h2><span class="chev">收起 ▴</span></div>'+
    list.map((s,i)=>{
    const pct=s.total?s.done/s.total*100:0;
    const left=s.missing.length;
    const head=s.missing.slice(0,LINK_CAP).join('');
    const foot=left
      ? `<span>還缺 <b>${left.toLocaleString()}</b> 字</span>`+
        `<a href="/annotate?q=${encodeURIComponent(head)}">照字表順序接著取${
          left>LINK_CAP?`（前 ${LINK_CAP} 個）`:''} →</a>`
      : '<span class="stdone">✓ 這張表全部取完了</span>';
    return `<div class="strow ${i?'b':'a'}">
      <div class="sthead">
        <span class="stname">${s.name}<small>${s.full}</small></span>
        <span class="stnum"><b>${s.done.toLocaleString()}</b> / ${s.total.toLocaleString()}　${pct.toFixed(1)}%</span>
      </div>
      <div class="stbar"><i style="width:${pct.toFixed(2)}%"></i></div>
      <div class="stfoot">${foot}</div>
    </div>`;
  }).join('')+'</div>';

  /* 收合狀態記在 localStorage。展開時只有標題那排收得動，不然點「照字表順序
     接著取」會先把卡片收起來；收合後整張卡片都可以點開，因為標題已經藏起來了。 */
  const card=$('#stdbox');
  const setC=v=>{
    stdCollapsed=v;
    localStorage.setItem(STD_KEY,v?'1':'0');
    card.classList.toggle('collapsed',v);
    if(v) card.setAttribute('title','展開官方字表覆蓋率'); else card.removeAttribute('title');
  };
  card.addEventListener('click',e=>{
    if(stdCollapsed){ setC(false); return; }
    if(e.target.closest('.stdhead')) setC(true);
  });
}

/* ---------- 繁體／簡體／傳承／日本漢字：純顯示（開關搬到圖表上方那排小按鈕了，
   這裡不再點得動），只留「看這些字」連去 /annotate？q=。 ---------- */
const CATDESC={trad:'有對應簡體字，如 國魚雲',simp:'簡體專屬，如 国鸟',inherited:'如人天后',jp:'新字体／國字，如県駅鉄'};
function renderCats(data){
  const chars={trad:data.tradChars||[],simp:data.simpChars||[],
    inherited:data.inheritedChars||[],jp:data.jpChars||[]};
  const box=document.createElement('div');
  box.className='stats';
  const mk_=(k,label,sub,list,extraClass)=>{
    const d=document.createElement('div');
    const on=catOn[k];
    d.className='tile'+(on?'':' off')+(extraClass?' '+extraClass:'');
    d.innerHTML=`<span class="k">${label}</span><span class="v num">${list.length.toLocaleString()}<small>${sub}</small></span>`+
      (list.length?`<a class="view" href="/annotate?q=${encodeURIComponent(list.join(''))}">看這些字 →</a>`:'');
    return d;
  };
  CATDEF.forEach(c=>box.appendChild(mk_(c.key,c.name,CATDESC[c.key],chars[c.key])));

  const union=new Set();
  CATDEF.forEach(c=>{if(catOn[c.key])chars[c.key].forEach(ch=>union.add(ch));});
  const chosen=CATDEF.filter(c=>catOn[c.key]).map(c=>c.name).join('＋')||'（沒有勾選）';
  box.appendChild(mk_('sum','加總',chosen,[...union],'sum'));

  const old=$('#catstats'); if(old) old.remove();
  const wrap=document.createElement('div'); wrap.id='catstats'; wrap.appendChild(box);
  $('#stats').insertAdjacentElement('afterend',wrap);
}
</script>
