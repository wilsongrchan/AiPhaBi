# 把 site/ 發佈到 GitHub Pages。
#
# 為什麼要用 workflow 而不是直接指定資料夾：GitHub Pages 的「從分支發佈」只能選 / 或 /docs，
# 而 docs/ 已經放了手稿和截圖。走 Actions 這條路可以發佈任何資料夾，順便在部署前重新產生
# 網站資料，網站上的碼表與進度數字因此永遠對得上 main 上的 data/codes.json。
#
# 一次性設定（在 GitHub 網頁上做，workflow 自己做不到）：
#   Settings → Pages → Build and deployment → Source 選 **GitHub Actions**
# 沒設這個，這個 workflow 會在 deploy 那一步失敗。
#
# 網址：https://wilsongrchan.github.io/AiPhaBi/ —— 是專案站，網站在 /AiPhaBi/ 底下，
# 所以 site/ 裡的連結與資源一律用相對路徑，絕對路徑（/assets/…）會全部 404。
#
# ⚠️ 2026-08-17：網站已下架，這個 workflow 改成**只能手動觸發**。
#
# 原因：Wilson 要先跟 Side C 把網站做到滿意才公開。原本的觸發條件包含 push 到 main 且
# 動到 data/codes.json、rules.json、freq.json、standards/**——那些是 **Side A 每次取碼
# 都會動的檔案**。留著的話，Side A 提交幾個新字就會跑這個 workflow，而 configure-pages
# 會把已經關掉的 Pages 重新開起來、把網站再推上線，誰都沒打算這樣。
#
# 要重新公開時，兩件事都要做（缺一不可）：
#   1. GitHub 網頁：Settings → Pages → Build and deployment → Source 選 GitHub Actions
#   2. 把下面的 push: 觸發條件解除註解
# 在那之前要預覽，一律用本機：
#   python3 site/tools/build_site_data.py && python3 -m http.server 8099 --directory site

name: Deploy site to Pages

on:
  # 網站確定要公開之前，不要解除這一段的註解 —— 見上面的說明。
  # push:
  #   branches: [main]
  #   paths:
  #     - 'site/**'
  #     - '.github/workflows/pages.yml'
  #     # 網站的數字和試打碼表是從這些檔案產生的，它們一動就該重新部署
  #     - 'data/codes.json'
  #     - 'data/rules.json'
  #     - 'data/freq.json'
  #     - 'data/opencc.json'
  #     - 'data/standards/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；排隊而不是互相取消，免得比較新的一次被比較舊的一次蓋掉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pypinyin 是拼音查字（pinyin.json）唯一的外部依賴；裝不起來不該擋住整個部署——
      # build_pinyin() 自己抓不到 pypinyin 就回傳 None，那一塊留白，其餘頁面不受影響。
      - name: 安裝建置依賴
        run: pip install -r requirements.txt

      # 產生 site/assets/dict.json 與 site/assets/t2s.json（兩個都不進 git）
      - name: 產生網站資料
        run: python3 site/tools/build_site_data.py

      - name: 確認產出存在
        run: |
          test -s site/assets/dict.json  || { echo "dict.json 沒產出來";  exit 1; }
          test -s site/assets/t2s.json   || { echo "t2s.json 沒產出來";   exit 1; }
          test -s site/assets/zigen.json || { echo "zigen.json 沒產出來"; exit 1; }
          # glyphs.json 要下載 29MB 的第三方資料，網路出問題就會沒有。
          # 這不該擋住部署 —— 字根表會自動退回純文字版，其餘頁面完全不受影響。
          if [ -s site/assets/glyphs.json ]; then
            echo "字根圖形：有（$(wc -c < site/assets/glyphs.json) bytes）"
            # 授權要求：散布字形資料就必須隨附授權全文
            test -s site/ARPHICPL.txt || { echo "有字形資料卻沒有 ARPHICPL.txt，違反授權"; exit 1; }
          else
            echo "::warning::glyphs.json 沒產出來，字根表會是純文字版"
          fi
          # practice.json（試打頁的參考文章）也帶著同一份 Arphic 字形資料，
          # 所以同一條義務要再查一次 —— glyphs.json 沒產出來、這個卻產出來了，
          # 一樣是在散布字形資料。
          if [ -s site/assets/practice.json ]; then
            echo "參考文章：有（$(wc -c < site/assets/practice.json) bytes）"
            test -s site/ARPHICPL.txt || { echo "有字形資料卻沒有 ARPHICPL.txt，違反授權"; exit 1; }
            # 少數幾個字（目前只有「為」）的字形改用教育部標準筆順（g0v/zh-stroke-data），
            # 那份資料的條件是非商業＋教育用途＋註明出處，出處檔一樣要跟著發佈。
            if grep -q '"tw_glyph_source"' site/assets/practice.json; then
              test -s site/TWSTROKE.txt || { echo "有教育部筆順資料卻沒有 TWSTROKE.txt，違反使用條件"; exit 1; }
              echo "教育部標準筆順：有，TWSTROKE.txt 在"
            fi
          else
            echo "::warning::practice.json 沒產出來，試打頁不會有參考文章與田字格"
          fi
          # 拼音查字拆成兩份：pinyin.json 是「查得到什麼字」（小，載入就抓），
          # pinyin_glyphs.json 是拆碼圖與字形（大，點進查字框才抓）。
          # 帶 Arphic 字形資料的是後者，同一條義務要對它查。
          if [ -s site/assets/pinyin.json ]; then
            echo "拼音查字：有（$(wc -c < site/assets/pinyin.json) bytes）"
          else
            echo "::warning::pinyin.json 沒產出來，自由試打不會有拼音查字"
          fi
          if [ -s site/assets/pinyin_glyphs.json ]; then
            echo "拼音查字的拆碼圖：有（$(wc -c < site/assets/pinyin_glyphs.json) bytes）"
            test -s site/ARPHICPL.txt || { echo "有字形資料卻沒有 ARPHICPL.txt，違反授權"; exit 1; }
          else
            echo "::warning::pinyin_glyphs.json 沒產出來，查到的字不會有田字格與拆碼圖"
          fi

      # _review/ 是內部審查工具（代表字對照頁），不該出現在公開網站上。
      # 它已經 gitignore，CI 上本來就不會有；這一步是保險，避免哪天有人不小心提交進來。
      - name: 移除內部審查頁
        run: rm -rf site/_review

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
