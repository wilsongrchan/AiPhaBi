<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兼容字型一覽 · 愛發筆</title>
<style>
  :root {
    --bg:#faf9f7; --card:#fff; --ink:#1c1a17; --muted:#7c7568; --line:#e3ded4;
    --accent:#b4531f; --warn:#d98324; --ok:#2e7d4f; --bad:#c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16150f; --card:#1f1e18; --ink:#ece7dc; --muted:#9a9284; --line:#33312a;
            --accent:#e0894f; --warn:#e0a95c; --ok:#6bbd8e; --bad:#e57373; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,"PingFang TC","Helvetica Neue",sans-serif; }
  nav { display:flex; gap:5px; flex-wrap:wrap; max-width:900px; margin:0 auto; padding:14px 20px 0; }
  nav a { font-size:13px; color:var(--muted); text-decoration:none; padding:4px 9px;
    border:1px solid var(--line); border-radius:7px; }
  nav a.on { color:#fff; background:var(--accent); border-color:var(--accent); }
  .wrap { max-width:900px; margin:0 auto; padding:18px 20px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .lede { color:var(--muted); font-size:13px; margin:0 0 22px; max-width:640px; }
  .lede code { font:600 12px ui-monospace,monospace; color:var(--accent); }
  .sec { margin-top:26px; }
  .sec > h2 { font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .sec > h2 .n { color:var(--muted); font-weight:400; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
  a.card { display:flex; align-items:center; gap:10px; text-decoration:none;
    border:1px solid var(--line); border-radius:10px; padding:7px 10px; background:var(--card); }
  a.card:hover { border-color:var(--accent); }
  a.card .c { font-size:28px; font-family:"PingFang TC","Songti TC",serif; color:var(--ink); line-height:1; }
  a.card .meta { font:600 11px ui-monospace,monospace; color:var(--muted); }
  a.card .meta b { color:var(--warn); }
  details { border:1px solid var(--line); border-radius:10px; background:var(--card); padding:0 12px; }
  details[open] { padding-bottom:12px; }
  details > summary { cursor:pointer; padding:11px 0; font-size:13px; color:var(--muted);
    list-style:none; display:flex; align-items:center; gap:8px; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary .tw { color:var(--accent); }
  details .grid { margin-top:2px; }
  .note { font-size:12px; color:var(--muted); margin-top:6px; }
  .status { color:var(--muted); font-size:13px; }

  /* 已收錄的兼容碼／兼容字型：已經存進 codes.json 的（不是候選，是成果） */
  details > summary .rec-ctrls { margin-left:auto; display:flex; align-items:center; gap:10px; }
  details > summary .rec-ctrls select { font-size:11px; color:var(--muted); background:var(--card);
    border:1px solid var(--line); border-radius:6px; padding:2px 4px; cursor:pointer; }
  details > summary .toggle { font-size:11px; color:var(--muted); display:flex;
    align-items:center; gap:4px; cursor:pointer; font-weight:400; }
  .rec-grp { margin-bottom:14px; }
  .rec-grp-h { font-size:12px; color:var(--muted); margin:0 0 6px; display:flex; align-items:baseline; gap:6px; }
  .rec-grp-h b { font:600 16px "PingFang TC",serif; color:var(--ink); }
  a.card.rec .meta { margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  a.card.rec .meta .main { color:var(--ink); font-size:12px; }
  a.card.rec .meta .alt { color:var(--accent); font-size:10px; text-align:right; }
  /* 標籤（兼容碼：）跟碼各自不能從中間斷開；容不下一行時，只准從兩者之間斷 */
  a.card.rec .meta .alt-tag, a.card.rec .meta .alt-code { white-space:nowrap; }
</style>
</head>
<body>
<nav>
  <a href="/">字根表</a><a href="/annotate">逐字取碼</a><a href="/variants" class="on">兼容字型</a><a href="/stats">碼表分析</a><a href="/rules">取碼原則</a><a href="/short">簡碼</a><a href="/type">試打</a><a href="/progress">取碼進度</a>
</nav>
<div class="wrap">
  <h1>兼容字型一覽</h1>
  <p class="lede">
    同一個字有兩種通行寫法（例如 <b>為</b>：大陸 <code>12</code> 筆、台灣 <code>9</code> 筆），
    兩種形狀都被視為同一個字。這裡列出「台灣教育部標準字形」與「大陸 makemeahanzi 字形」
    <b>筆數不同</b>的字，依字頻排序——這是可自動偵測的可靠訊號。
    同筆數的細部變體（中線比對才分得出）抓不到，得靠你在取碼時自行留意。
    點任何一個字，到逐字取碼頁看三地官方筆順對照。
  </p>
  <div id="recorded"></div>
  <div id="body"><p class="status">計算中…</p></div>
</div>
<script>
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t);
  if (c) e.className = c; if (x != null) e.textContent = x; return e; };

function card(it) {
  const a = el('a', 'card');
  a.href = '/annotate?c=' + encodeURIComponent(it.c);
  a.title = `${it.c}：大陸 ${it.prc} 筆 / 台灣 ${it.tw} 筆 —— 點去看`;
  a.append(el('span', 'c', it.c));
  const m = el('span', 'meta');
  m.innerHTML = `陸 ${it.prc}<br><b>台 ${it.tw}</b>`;
  a.append(m);
  return a;
}

function grid(items) {
  const g = el('div', 'grid');
  for (const it of items) g.append(card(it));
  return g;
}

/* ---------- 已收錄的兼容碼／兼容字型 ---------- */
const IDS_OPS = '⿰⿱⿲⿳⿴⿵⿶⿷⿸⿹⿺⿻';
const STROKEISH = new Set([...'丶一丨丿乀乁乚亅㇏丷丶']);
function topParts(ch, ids) {          /* 第一層部件（同 annotate 的相關字邏輯，這裡自成一份） */
  const d = ids[ch];
  if (!d) return [];
  return [...new Set([...d].filter(c =>
    !IDS_OPS.includes(c) && c !== ch && /[㐀-鿿]/.test(c) && !STROKEISH.has(c)))];
}
function finalOf(code, maxRule) {     /* 跟主碼一致的縮短規則（前 head + 末 tail） */
  if (!maxRule || !code) return code;
  const p = maxRule.params || {};
  const mx = p.max ?? 5, head = p.head ?? 4, tail = p.tail ?? 1;
  if (code.length <= mx) return code;
  return code.slice(0, head) + (tail ? code.slice(-tail) : '');
}
function recCard(e) {
  const a = el('a', 'card rec');
  a.href = '/annotate?c=' + encodeURIComponent(e.ch);
  a.title = `${e.ch}` + (e.display && e.display !== e.ch ? `（顯示 ${e.display}）` : '') +
    ` —— 主碼 ${e.mainCode}，${e.tag} ${e.label}，點去看`;
  a.append(el('span', 'c', e.ch));
  const m = el('span', 'meta');
  m.innerHTML = `<b class="main">${e.mainCode}</b>` +
    `<span class="alt"><span class="alt-tag">${e.tag}：</span> <span class="alt-code">${e.label}</span></span>`;
  a.append(m);
  return a;
}
function recGrid(items) {
  const g = el('div', 'grid');
  for (const e of items) g.append(recCard(e));
  return g;
}
let recGroup = false;
let recFilter = 'all';   /* all｜alt（只看兼容碼）｜variant（只看兼容字型） */
function renderRecorded(codes, ids, maxRule) {
  const box = $('#recorded');
  const entries = [];
  for (const [ch, rec] of Object.entries(codes)) {
    if (!rec.code) continue;
    const mainCode = finalOf(rec.code, maxRule);
    /* 一個字可以收好幾條兼容碼（例：卅 IJN、INJ）——合成一張卡，逗號隔開，
       不要每條各開一張長得一模一樣的卡片。 */
    const altCodes = (rec.alts || []).map(a => finalOf(a.code, maxRule));
    if (altCodes.length) {
      entries.push({ ch, mainCode, tag: '兼容碼', type: 'alt', label: altCodes.join('、') });
    }
    /* 台灣、香港兩地剛好收成同一個碼時（例：啡 OJEE），合成一張卡「港台字形」，
       不要兩張長得一模一樣的卡片並排、只差標籤。 */
    const byLabel = new Map();
    for (const v of rec.variants || []) {
      const label = finalOf(v.code, maxRule);
      if (!byLabel.has(label)) byLabel.set(label, { forms: new Set(), display: v.display });
      byLabel.get(label).forms.add(v.form);
    }
    for (const [label, info] of byLabel) {
      const tag = (info.forms.has('tw') && info.forms.has('hk')) ? '港台字形'
        : info.forms.has('hk') ? '香港字形' : '台灣字形';
      entries.push({ ch, mainCode, tag, type: 'variant', label, display: info.display });
    }
  }
  box.innerHTML = '';
  if (!entries.length) return;

  const sec = el('div', 'sec');
  const d = document.createElement('details');
  const sm = document.createElement('summary');
  sm.innerHTML = `已收錄的兼容碼／兼容字型　<span class="tw">${entries.length} 字</span>　▾`;
  const ctrls = el('span', 'rec-ctrls');
  ctrls.onclick = e => e.stopPropagation();   /* 別讓這兩個控制項順便把整個區塊收合了 */
  const filterSel = document.createElement('select');
  filterSel.id = 'recFilterSel';
  filterSel.innerHTML = `<option value="all">全部</option><option value="alt">只看兼容碼</option>` +
    `<option value="variant">只看兼容字型</option>`;
  filterSel.value = recFilter;
  const toggle = el('label', 'toggle');
  toggle.innerHTML = `<input type="checkbox" id="recGroupBox"${recGroup ? ' checked' : ''}>依部件分組`;
  ctrls.append(filterSel, toggle);
  sm.append(ctrls);
  d.append(sm);
  d.append(Object.assign(el('p', 'note'),
    { textContent: '你手動收的另一種拆法（兼容碼），或另一地區的通行寫法（兼容字型）——這是已經打得出來的成果，不是待辦。' }));
  const list = el('div', 'rec-list');
  d.append(list);
  sec.append(d);
  box.append(sec);

  const renderList = () => {
    list.innerHTML = '';
    const filtered = recFilter === 'all' ? entries : entries.filter(e => e.type === recFilter);
    if (!filtered.length) {
      list.innerHTML = '<div class="note">這個篩選條件下沒有資料。</div>';
      return;
    }
    if (!recGroup) {
      const sorted = [...filtered].sort((a, b) => a.ch.localeCompare(b.ch, 'zh-Hant'));
      list.append(recGrid(sorted));
      return;
    }
    const charSet = new Set(filtered.map(e => e.ch));
    const isRoot = new Set();
    for (const ch of charSet) {
      for (const other of charSet) {
        if (other !== ch && topParts(other, ids).includes(ch)) { isRoot.add(ch); break; }
      }
    }
    const compOf = new Map();   /* 部件 → 用到它的字（只算入列的） */
    for (const ch of charSet) {
      for (const p of topParts(ch, ids)) {
        if (!compOf.has(p)) compOf.set(p, []);
        compOf.get(p).push(ch);
      }
    }
    const keyOf = ch => {
      if (isRoot.has(ch)) return ch;
      for (const p of topParts(ch, ids)) if (isRoot.has(p)) return p;
      for (const p of topParts(ch, ids)) if ((compOf.get(p) || []).length >= 2) return p;
      return null;
    };
    const groups = new Map();
    const loose = [];
    for (const e of filtered) {
      const k = keyOf(e.ch);
      if (k) { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
      else loose.push(e);
    }
    for (const k of [...groups.keys()].sort((a, b) => groups.get(b).length - groups.get(a).length)) {
      const grp = el('div', 'rec-grp');
      const gh = el('div', 'rec-grp-h');
      gh.innerHTML = `<b>${k}</b><span>${groups.get(k).length} 筆</span>`;
      grp.append(gh);
      grp.append(recGrid(groups.get(k)));
      list.append(grp);
    }
    if (loose.length) {
      const grp = el('div', 'rec-grp');
      grp.append(el('div', 'rec-grp-h', `其他（沒有明顯共用部件，${loose.length} 筆）`));
      grp.append(recGrid(loose));
      list.append(grp);
    }
  };
  renderList();
  $('#recGroupBox').onchange = e => { recGroup = e.target.checked; renderList(); };
  $('#recFilterSel').onchange = e => { recFilter = e.target.value; renderList(); };
}

Promise.all([
  fetch('/api/codes').then(r => r.json()),
  fetch('/api/ids').then(r => r.json()).catch(() => ({})),
  fetch('/api/rules').then(r => r.json()).catch(() => ({ rules: [] })),
]).then(([codes, ids, rules]) => {
  const maxRule = (rules.rules || []).find(r => r.id === 'max_code_length' && r.enabled);
  renderRecorded(codes, ids, maxRule);
}).catch(() => {});

fetch('/api/variants').then(r => r.json()).then(list => {
  const body = $('#body');
  body.innerHTML = '';
  if (!list.length) { body.innerHTML = '<p class="status">沒有資料（台灣筆順檔可能還沒下載）。</p>'; return; }

  const distinct = list.filter(x => x.group === 'distinct');
  const walk = list.filter(x => x.group === 'walk');
  const mound = list.filter(x => x.group === 'mound');
  /* 筆數差 ≥2 多半是真的兩種字形（為 陸12/台9）；差 1 很多只是計筆慣例（之、以、及）。 */
  const big = distinct.filter(x => Math.abs(x.prc - x.tw) >= 2);
  const one = distinct.filter(x => Math.abs(x.prc - x.tw) === 1);

  /* 形狀明顯不同的：直接攤開，這是「兼容字型」最典型的一群 */
  const s1 = el('div', 'sec');
  const h = el('h2'); h.innerHTML = `形狀明顯不同（筆數差 ≥2）　<span class="n">${big.length} 字</span>`;
  s1.append(h);
  s1.append(grid(big));
  s1.append(Object.assign(el('p', 'note'),
    { textContent: '差兩筆以上，通常是真的兩種通行寫法（為、勻、鄉…），最值得逐個確認取碼。' }));
  body.append(s1);

  /* 系統性偏旁差異：摺起來，要看再展開 */
  const collapse = (title, items, hint) => {
    if (!items.length) return;
    const s = el('div', 'sec');
    const d = document.createElement('details');
    const sm = document.createElement('summary');
    sm.innerHTML = `${title}　<span class="tw">${items.length} 字</span>　▾`;
    d.append(sm);
    d.append(grid(items));
    if (hint) d.append(Object.assign(el('p', 'note'), { textContent: hint }));
    s.append(d);
    body.append(s);
  };
  collapse('筆數只差 1（多為計筆慣例）', one,
    '差一筆的，很多只是兩地「同一形、算法不同」（之、以、及、年…），未必是不同字形——看看就好。');
  collapse('走之底「辶」系統性差異', walk,
    '大陸「辶」一點、台灣兩點，凡走之底的字筆數都差 1（這、過、道、進…）——同一條差異，不必逐個看。');
  collapse('阜／邑旁「阝」系統性差異', mound,
    '「阝」旁的字（都、部、防、阿…）也是整批同型的筆數差異。');

  renderGaps();      /* 兼容變體缺口：置於最前，最值得動手 */
}).catch(e => {
  $('#body').innerHTML = '<p class="status">讀取失敗：' + e + '</p>';
});

/* ---------- 兼容變體缺口：新聞常用、但你取的是另一種寫法 ---------- */
function gapCard(p) {
  const a = el('a', 'card');
  a.href = '/annotate?c=' + encodeURIComponent(p.missing);
  a.title = `新聞用「${p.missing}」，你取碼的是「${p.coded}」——點去補取「${p.missing}」`;
  a.append(el('span', 'c', p.missing));
  const m = el('span', 'meta');
  m.innerHTML = `已取 <b>${p.coded}</b><br>新聞 ${p.n}`;
  a.append(m);
  return a;
}
function gapGrid(items) {
  const g = el('div', 'grid');
  for (const p of items) g.append(gapCard(p));
  return g;
}
function renderGaps() {
  fetch('/api/variant-gaps').then(r => r.json()).then(data => {
    const pairs = (data && data.pairs) || [];
    if (!pairs.length) return;
    const trad = pairs.filter(p => !p.simp);
    const simp = pairs.filter(p => p.simp);
    const sec = el('div', 'sec');
    const h = el('h2');
    h.innerHTML = `兼容變體缺口　<span class="n">${trad.length} 字</span>`;
    sec.append(h);
    sec.append(Object.assign(el('p', 'note'),
      { textContent: '台港今日新聞出現這些寫法，但你取碼的是同一個字的另一種形。補取它們，兩種寫法就都打得出。' }));
    if (trad.length) sec.append(gapGrid(trad));
    if (simp.length) {
      const d = document.createElement('details');
      const sm = document.createElement('summary');
      sm.innerHTML = `大陸簡化字寫法（台港通常不必取）　<span class="tw">${simp.length} 字</span>　▾`;
      d.append(sm);
      d.append(gapGrid(simp));
      sec.append(d);
    }
    $('#body').insertBefore(sec, $('#body').firstChild);   /* 放到最前面 */
  }).catch(() => {});
}
</script>
</body>
</html>
