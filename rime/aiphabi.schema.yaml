# 愛發筆 AiPhaBi —— 形碼輸入法
# 由 build_rime.py 產生。字根看鍵盤上那個英文字母長什麼樣（山→W、口→O、弓→S…），
# 不必背 A=日 B=月 這種對照表。

schema:
  schema_id: aiphabi
  name: 愛發筆
  version: "2026.07.31"
  author:
    - wilsongrchan
  description: |
    形碼輸入法。字根的形狀就是鍵盤上那個英文字母的形狀。
    主碼最多 5 碼（前 4 碼 + 末 1 碼）；把整個字拆完、
    每一碼都打出來（完整碼）一樣打得出字。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半形, 全形 ]
  - name: simplification          # 簡繁兼容：一鍵把輸出換成簡體（預設繁體）
    reset: 0
    states: [ 繁, 簡 ]
  - name: aiphabi_family          # 同類字提示（形近字家族）
    reset: 1
    states: [ 同類關, 同類開 ]
  - name: aiphabi_comp            # 偏旁碼提示
    reset: 1
    states: [ 偏旁關, 偏旁開 ]
  - name: aiphabi_fuzzy           # 輸入容錯
    reset: 1
    states: [ 容錯關, 容錯開 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - lua_translator@aiphabi_wildcard   # 萬用鍵 `：某幾碼想不起來就按 `
  filters:
    - lua_filter@aiphabi_hint           # 同類字 + 偏旁碼提示
    - lua_filter@aiphabi_fuzzy          # 輸入容錯（漏碼/多碼/隔壁鍵/打反）
    - simplifier            # 簡繁兼容：simplification 開關打開時，輸出轉簡體
    - uniquifier

speller:
  alphabet: 'zyxwvutsrqponmlkjihgfedcba`'   # 收 ` 進字母表：萬用鍵才輸入得進來
  delimiter: " '"

translator:
  dictionary: aiphabi
  enable_charset_filter: false
  enable_sentence: false
  enable_encoder: false
  enable_completion: true      # 碼還沒打完就先給候選
  strict_spelling: false

# 簡繁兼容：預設輸出繁體；把 simplification 開關打開就整段轉簡體（OpenCC t2s，Squirrel 內建）。
simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: none

# 標點：正體中文的全形標點。字母鍵全部給字根用，標點就落在原本的標點鍵上。
punctuator:
  import_preset: default
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ';': '；'
    ':': '：'
    '\': '、'
    '/': '、'
    '(': '（'
    ')': '）'
    '[': '「'
    ']': '」'
    '{': '『'
    '}': '』'
    '<': '《'
    '>': '》'
    '~': '～'
    '^': '……'
    '_': '——'
    '-': '－'
    '"': { pair: [ '「', '」' ] }
    "'": { pair: [ '『', '』' ] }
    '@': '＠'
    '#': '＃'
    '%': '％'
    '&': '＆'
    '*': '＊'
    '+': '＋'
    '=': '＝'
    '|': '｜'
    '$': '＄'

key_binder:
  import_preset: default

recognizer:
  import_preset: default
