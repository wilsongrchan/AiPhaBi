# 愛發筆 AiPhaBi —— 形碼輸入法
# 由 build_rime.py 產生。字根看鍵盤上那個英文字母長什麼樣（山→W、口→O、弓→S…），
# 不必背 A=日 B=月 這種對照表。

schema:
  schema_id: aiphabi
  name: 愛發筆
  version: "2026.08.11"
  author:
    - wilsongrchan
  description: |
    形碼輸入法。字根的形狀就是鍵盤上那個英文字母的形狀。
    主碼最多 5 碼（前 4 碼 + 末 1 碼）；把整個字拆完、
    每一碼都打出來（完整碼）一樣打得出字。

switches:
  # ascii_mode 不放進來：不需要它出現在方案選單／狀態列選單裡——
  # Shift 鍵本來就能切中英文（鼠鬚管內建的 ascii_composer 行為，與這份清單無關）。
  # 底下這些開關都不設 reset：讓每一個都記住使用者上次的選擇，不會切個輸入法
  # 再切回來、或重新部署一次，就被強制打回預設值（reset 這個欄位在 librime 裡
  # 就是「每次 engine 重建都強制設回這個值」，蓋掉剛從使用者設定檔還原的值）。
  - name: full_shape
    states: [ 半形, 全形 ]
  - name: aiphabi_t2s              # 打繁出簡：候選字順便帶出簡體版
    states: [ 打繁出簡關, 打繁出簡開 ]
  - name: aiphabi_s2t              # 打簡出繁：候選字順便帶出繁體版
    states: [ 打簡出繁關, 打簡出繁開 ]
  - name: aiphabi_family          # 同類字提示（形近字家族）
    states: [ 同類字關, 同類字開 ]
  - name: aiphabi_comp            # 偏旁碼提示
    states: [ 偏旁關, 偏旁開 ]
  - name: aiphabi_fuzzy           # 輸入容錯
    states: [ 容錯關, 容錯開 ]
  - name: aiphabi_no_simp          # 不打簡體：候選只留繁體字／傳承字，濾掉簡體專屬字
    states: [ 不打簡體關, 不打簡體開 ]
  - name: aiphabi_short100          # 約定簡碼：手動挑的常用字，首尾兩碼
    states: [ 簡碼關, 簡碼開 ]
  - name: aiphabi_short3            # 三簡碼：頭兩碼+末一碼，當 AB`C 查
    states: [ 三簡碼關, 三簡碼開 ]
  - name: aiphabi_phrase            # 詞組連打：常用詞用各字簡碼串接直接打
    states: [ 詞組關, 詞組開 ]
  - name: prediction                # 智能聯想：選完字，猜下一個字／詞
    states: [ 聯想關, 聯想開 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - predictor
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - predict_translator
    - punct_translator
    - table_translator
    - lua_translator@aiphabi_wildcard   # 萬用鍵 `：某幾碼想不起來就按 `
  filters:
    - lua_filter@aiphabi_phrase         # 詞組連打開關：關掉就濾掉多字候選（詞組）
    - lua_filter@aiphabi_hint           # 同類字 + 偏旁碼 + 打繁出簡 + 打簡出繁 提示
    - lua_filter@aiphabi_fuzzy          # 輸入容錯（漏碼/多碼/隔壁鍵/打反）
    - lua_filter@aiphabi_order          # 候選重排：簡碼 → 主碼exact → 其餘照 選過/常用度
    - uniquifier

speller:
  alphabet: 'zyxwvutsrqponmlkjihgfedcba`'   # 收 ` 進字母表：萬用鍵才輸入得進來
  delimiter: " '"

translator:
  dictionary: aiphabi
  enable_charset_filter: false
  enable_sentence: true        # 打過某詞的碼還繼續打時，靠切分把已知的詞留在候選、並幫忙組出整句
  enable_encoder: false
  enable_completion: true      # 碼還沒打完就先給候選
  strict_spelling: false
  preedit_format:              # 螢幕上顯示大寫（實際查碼仍用小寫；` 不動）
    - "xlit|abcdefghijklmnopqrstuvwxyz|ABCDEFGHIJKLMNOPQRSTUVWXYZ|"
  comment_format:              # 候選旁邊的碼提示也顯示大寫
    - "xlit|abcdefghijklmnopqrstuvwxyz|ABCDEFGHIJKLMNOPQRSTUVWXYZ|"
    - "xform/~/- /"            # 補碼提示的 ~ 改成「- 」（例 ~K → - K）

predictor:
  db: predict.db
  max_candidates: 5    # 配 menu.page_size，一頁看得完
  max_iterations: 1    # 選了聯想候選後，最多再連續猜一輪，別一路猜下去

menu:
  page_size: 6                 # 一次顯示 6 個候選（留多點空間給候選字放大）

# 標點：正體中文的全形標點。字母鍵全部給字根用，標點就落在原本的標點鍵上。
punctuator:
  import_preset: default
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ';': '；'
    ':': '：'
    '\': '、'
    '/': '、'
    '(': '（'
    ')': '）'
    '[': '「'
    ']': '」'
    '{': '『'
    '}': '』'
    '<': '《'
    '>': '》'
    '~': '～'
    '^': '……'
    '_': '——'
    '-': '－'
    '"': { pair: [ '「', '」' ] }
    "'": { pair: [ '『', '』' ] }
    '@': '＠'
    '#': '＃'
    '%': '％'
    '&': '＆'
    '*': '＊'
    '+': '＋'
    '=': '＝'
    '|': '｜'
    '$': '＄'

key_binder:
  import_preset: default

recognizer:
  import_preset: default
