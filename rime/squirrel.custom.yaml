patch:
  # 橫排一條 bar（跟試打頁一樣）
  "style/candidate_list_layout": linear
  "style/horizontal": true
  # 字級：候選字大、編碼/提示小
  "style/font_point": 18
  "style/label_font_point": 12          # 1. 2. 3. 的編號
  "style/comment_font_point": 11        # 「可能 JHJR」「同類」等提示 → 縮小
  "style/candidate_spacing": 35         # 候選群組（字＋提示）之間的間距
  "style/inline_preedit": true          # 輸入中的碼直接畫在游標處（canvas 編輯器如 Google Docs 較友善）
  # 套用愛發筆配色（深色 bar + 橙色高亮）
  "style/color_scheme": aiphabi
  "style/color_scheme_dark": aiphabi
  "preset_color_schemes/aiphabi":
    name: "愛發筆"
    back_color: 0x1E1E1E                 # 視窗底：深灰
    border_color: 0x3A3A3A
    text_color: 0xE6E6E6                 # 輸入中的碼
    hilited_text_color: 0xFFFFFF
    hilited_back_color: 0x3A3A3A
    candidate_text_color: 0xE6E6E6       # 一般候選字：淺灰白
    comment_text_color: 0xB8B8B8         # 提示文字：淺灰、好讀但不全白（BGR，灰階不用轉）
    label_color: 0xB8B8B8                # 編號：淺灰
    hilited_candidate_text_color: 0xFFFFFF
    hilited_candidate_back_color: 0x0078E0  # 選中的那顆＝橙色（BGR，實際 #E07800，較不刺眼、白字更清楚）
    hilited_comment_text_color: 0xDDF0FF
    hilited_candidate_label_color: 0xFFFFFF
