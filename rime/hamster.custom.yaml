patch:
  keyboards:
    - name: "愛發筆26鍵"
      isPrimary: true
      rows:
        - keys:
            # label 給大寫字母：字根的形狀是照大寫字母設計的（Q W E…），按鍵本身仍打小寫
            # （Rime 字母表本來就是小寫，char 不能改），只是鍵面顯示改成大寫比較符合直覺。
            - action: { character: { char: q } }
              label: "Q"
            - action: { character: { char: w } }
              label: "W"
            - action: { character: { char: e } }
              label: "E"
            - action: { character: { char: r } }
              label: "R"
            - action: { character: { char: t } }
              label: "T"
            - action: { character: { char: y } }
              label: "Y"
            - action: { character: { char: u } }
              label: "U"
            - action: { character: { char: i } }
              label: "I"
            - action: { character: { char: o } }
              label: "O"
            - action: { character: { char: p } }
              label: "P"
        - keys:
            # 恢復跟 iOS 一樣的 A-L 排法：左右各留半格縮排（跟下面 Z-M 那排同一套
            # characterMargin 手法），A 對齊在 Q 跟 W 中間，不要整排靠死左邊——
            # 之前把萬用鍵塞在這排最左邊會害整排位置往右移，破壞肌肉記憶。
            - action: { characterMargin: { char: a } }
              width: available
            - action: { character: { char: a } }
              label: "A"
            - action: { character: { char: s } }
              label: "S"
            - action: { character: { char: d } }
              label: "D"
            - action: { character: { char: f } }
              label: "F"
            - action: { character: { char: g } }
              label: "G"
            - action: { character: { char: h } }
              label: "H"
            - action: { character: { char: j } }
              label: "J"
            - action: { character: { char: k } }
              label: "K"
            - action: { character: { char: l } }
              label: "L"
            - action: { characterMargin: { char: l } }
              width: available
        - keys:
            # 萬用鍵搬來這裡（原本「符」的位置）：punctuation 現在都在 123 鍵
            # 那頁排滿了，「符」用不到了，位置剛好讓給萬用鍵，不用再擠進 A 那排。
            - action: { character: { char: "`" } }
              width: { percentage: 0.13 }
            - action: { characterMargin: { char: z } }
              width: available
            - action: { character: { char: z } }
              label: "Z"
            - action: { character: { char: x } }
              label: "X"
            - action: { character: { char: c } }
              label: "C"
            - action: { character: { char: v } }
              label: "V"
            - action: { character: { char: b } }
              label: "B"
            - action: { character: { char: n } }
              label: "N"
            - action: { character: { char: m } }
              label: "M"
            - action: { characterMargin: { char: m } }
              width: available
            - action: backspace
              width: { percentage: 0.13 }
              swipe:
                - direction: up
                  action: { shortcutCommand: "#重输" }
        - keys:
            # 仿 iOS 的 123 鍵：跟主鍵盤上的「符」一樣切去 AiPhaBiSymbols（一頁排滿的
            # 數字符號表），不是「仓」內建的九宮格數字鍵（跟這個輸入法的定位不合——
            # 這是形碼，不是拼音，用不到九宮格）。emoji 鍵沒加：翻過「仓」原始碼，
            # emoji 鍵盤那塊目前是空的 TODO（只畫一塊紅色空白），加了也打不出表情。
            # 寬度 0.19 對齊「仓」內建英文鍵盤的 123 鍵寬度（翻原始碼 smallBottomWidth
            # 硬編碼 0.19，沒有對應的 YAML 開關可以反過來調它），不然切中英文時
            # 123 鍵寬度不一樣，後面的鍵位置還是會跳一下。
            - action: { keyboardType: "AiPhaBiSymbols" }
              label: "123"
              width: { percentage: 0.19 }
            # 中/英切換改去我們自己刻的 AiPhaBiEnglish 鍵盤，不再用「仓」內建的
            # alphabetic——內建那顆鍵盤的第四排（切回鍵位置、句號鍵位置、123
            # 鍵寬度）好幾個地方跟這裡對不上，且找不到辦法把它每個細節都調到
            # 跟這裡一致（翻過原始碼，123 鍵寬度是寫死的，句號鍵那個開關對到
            # 的畫面又跟預期不符，猜測是「仓」App 版本比公開原始碼新）。自己刻
            # 一份就能保證每個鍵位都跟中文鍵盤對齊。
            - action: { keyboardType: "AiPhaBiEnglish" }
              label: "Eng"
              width: { percentage: 0.13 }
            - action: space
              width: available
              label:
                loadingText: "愛發筆"
                text: "空格"
            - action: { character: { char: "," } }
              label: "，"
              swipe:
                - direction: up
                  # 送 "." 給 Rime 讓 punctuator 轉全形（跟主鍵的 "," 一樣）在滑動手勢這條路
                  # 上不會轉換（回報：滑出來的是半形 .，不是全形。）；直接送全形字元繞過
                  # 這個問題，不依賴 punctuator 對滑動手勢也生效。
                  action: { character: { char: "。" } }
                  label: "。"
                  display: true
            - action: enter
              width: { percentage: 0.25 }

    # 自己刻的英文鍵盤：純打英文用，不透過 AiPhaBi 的取碼邏輯（q w e r t y…
    # 剛好也都是 AiPhaBi 的字根字母，若走 character 預設的 Rime 處理，會被當
    # 成在打形碼，不是打英文字母）。每顆字母鍵都明講 processByRIME: false，
    # 繞過 Rime，直接照打。大寫靠內建的 shift／KeyboardCase 機制：character
    # 動作在自訂鍵盤這層本來就會依目前大小寫狀態自動轉換（大寫/小寫），不用
    # 自己刻一份大寫鍵盤再切來切去，行為跟 iOS 內建鍵盤的 shift 一致（打一個
    # 字母就變回小寫；雙擊鎖定大寫由框架處理）。第四排排法跟中文鍵盤一模一樣
    # （123 同寬、切回中文鍵在同個位置、逗號句號同個位置、換行鍵同寬），這正是
    # 整個自訂英文鍵盤存在的理由——保證切中英文時第四排不再跳動。
    - name: "AiPhaBiEnglish"
      rows:
        - keys:
            - action: { character: { char: q } }
              processByRIME: false
            - action: { character: { char: w } }
              processByRIME: false
            - action: { character: { char: e } }
              processByRIME: false
            - action: { character: { char: r } }
              processByRIME: false
            - action: { character: { char: t } }
              processByRIME: false
            - action: { character: { char: y } }
              processByRIME: false
            - action: { character: { char: u } }
              processByRIME: false
            - action: { character: { char: i } }
              processByRIME: false
            - action: { character: { char: o } }
              processByRIME: false
            - action: { character: { char: p } }
              processByRIME: false
        - keys:
            # 跟中文鍵盤 A-L 那排一樣的半格縮排手法。
            - action: { characterMargin: { char: a } }
              width: available
              processByRIME: false
            - action: { character: { char: a } }
              processByRIME: false
            - action: { character: { char: s } }
              processByRIME: false
            - action: { character: { char: d } }
              processByRIME: false
            - action: { character: { char: f } }
              processByRIME: false
            - action: { character: { char: g } }
              processByRIME: false
            - action: { character: { char: h } }
              processByRIME: false
            - action: { character: { char: j } }
              processByRIME: false
            - action: { character: { char: k } }
              processByRIME: false
            - action: { character: { char: l } }
              processByRIME: false
            - action: { characterMargin: { char: l } }
              width: available
              processByRIME: false
        - keys:
            - action: shift
              width: { percentage: 0.13 }
            - action: { character: { char: z } }
              processByRIME: false
            - action: { character: { char: x } }
              processByRIME: false
            - action: { character: { char: c } }
              processByRIME: false
            - action: { character: { char: v } }
              processByRIME: false
            - action: { character: { char: b } }
              processByRIME: false
            - action: { character: { char: n } }
              processByRIME: false
            - action: { character: { char: m } }
              processByRIME: false
            - action: backspace
              width: { percentage: 0.13 }
        - keys:
            # 第四排刻意跟中文鍵盤（愛發筆26鍵）的第四排逐鍵對齊寬度與順序。123
            # 鍵去專門刻的英文符號頁（AiPhaBiSymbolsEN），不是中文那份
            # AiPhaBiSymbols——共用同一份的話，符號會被標點轉換規則轉成全形
            # 中文標點，且返回鍵寫死回中文鍵盤，從英文模式點進去再出來會
            # 「跳回中文」，兩個都是實際發生過的問題。
            - action: { keyboardType: "AiPhaBiSymbolsEN" }
              label: "123"
              width: { percentage: 0.19 }
            - action: { keyboardType: "愛發筆26鍵" }
              label: "中"
              width: { percentage: 0.13 }
            - action: space
              width: available
              label:
                loadingText: "愛發筆"
                text: "空格"
            - action: { character: { char: "," } }
              processByRIME: false
              swipe:
                - direction: up
                  action: { character: { char: "." } }
                  processByRIME: false
                  display: true
            - action: enter
              width: { percentage: 0.25 }

    # 英文符號鍵盤第一頁：逐鍵照抄 iOS 英文鍵盤的 123 頁（不是中文那份 123
    # 頁的排法——iOS 中英文的符號頁本來就不一樣，中文版括號用「」、這裡用
    # 原始 " ＆，第三排也完全不同，沒有度數符號、沒有反引號）。全部用
    # character + processByRIME: false，繞過標點轉換規則，打出來就是原始
    # ASCII，不會變成全形中文標點。
    - name: "AiPhaBiSymbolsEN"
      rows:
        - keys:
            - action: { character: { char: "1" } }
              processByRIME: false
            - action: { character: { char: "2" } }
              processByRIME: false
            - action: { character: { char: "3" } }
              processByRIME: false
            - action: { character: { char: "4" } }
              processByRIME: false
            - action: { character: { char: "5" } }
              processByRIME: false
            - action: { character: { char: "6" } }
              processByRIME: false
            - action: { character: { char: "7" } }
              processByRIME: false
            - action: { character: { char: "8" } }
              processByRIME: false
            - action: { character: { char: "9" } }
              processByRIME: false
            - action: { character: { char: "0" } }
              processByRIME: false
        - keys:
            - action: { character: { char: "-" } }
              processByRIME: false
            - action: { character: { char: "/" } }
              processByRIME: false
            - action: { character: { char: ":" } }
              processByRIME: false
            - action: { character: { char: ";" } }
              processByRIME: false
            - action: { character: { char: "(" } }
              processByRIME: false
            - action: { character: { char: ")" } }
              processByRIME: false
            - action: { character: { char: "$" } }
              processByRIME: false
            - action: { character: { char: "&" } }
              processByRIME: false
            - action: { character: { char: "@" } }
              processByRIME: false
            - action: { character: { char: "\"" } }
              processByRIME: false
        - keys:
            # 中間 5 顆一定要標明 width: available，理由跟中文符號頁一樣。
            - action: { keyboardType: "AiPhaBiSymbolsEN_more" }
              label: "#+="
              width: { percentage: 0.13 }
            - action: { character: { char: "." } }
              processByRIME: false
              width: available
            - action: { character: { char: "," } }
              processByRIME: false
              width: available
            - action: { character: { char: "?" } }
              processByRIME: false
              width: available
            - action: { character: { char: "!" } }
              processByRIME: false
              width: available
            - action: { character: { char: "'" } }
              processByRIME: false
              width: available
            - action: backspace
              width: { percentage: 0.13 }
        - keys:
            - action: { keyboardType: "AiPhaBiEnglish" }
              label: "ABC"
              width: { percentage: 0.19 }
            - action: space
              width: available
              label:
                loadingText: "愛發筆"
                text: "空格"
            - action: enter
              width: { percentage: 0.19 }

    # 英文符號鍵盤第二頁：逐鍵照抄 iOS 英文鍵盤的 #+= 頁。
    - name: "AiPhaBiSymbolsEN_more"
      rows:
        - keys:
            - action: { character: { char: "[" } }
              processByRIME: false
            - action: { character: { char: "]" } }
              processByRIME: false
            - action: { character: { char: "{" } }
              processByRIME: false
            - action: { character: { char: "}" } }
              processByRIME: false
            - action: { character: { char: "#" } }
              processByRIME: false
            - action: { character: { char: "%" } }
              processByRIME: false
            - action: { character: { char: "^" } }
              processByRIME: false
            - action: { character: { char: "*" } }
              processByRIME: false
            - action: { character: { char: "+" } }
              processByRIME: false
            - action: { character: { char: "=" } }
              processByRIME: false
        - keys:
            - action: { character: { char: "_" } }
              processByRIME: false
            - action: { character: { char: "\\" } }
              processByRIME: false
            - action: { character: { char: "|" } }
              processByRIME: false
            - action: { character: { char: "~" } }
              processByRIME: false
            - action: { character: { char: "<" } }
              processByRIME: false
            - action: { character: { char: ">" } }
              processByRIME: false
            - action: { symbol: { char: "€" } }
            - action: { symbol: { char: "£" } }
            - action: { symbol: { char: "¥" } }
            - action: { symbol: { char: "•" } }
        - keys:
            - action: { keyboardType: "AiPhaBiSymbolsEN" }
              label: "123"
              width: { percentage: 0.13 }
            - action: { character: { char: "." } }
              processByRIME: false
              width: available
            - action: { character: { char: "," } }
              processByRIME: false
              width: available
            - action: { character: { char: "?" } }
              processByRIME: false
              width: available
            - action: { character: { char: "!" } }
              processByRIME: false
              width: available
            - action: { character: { char: "'" } }
              processByRIME: false
              width: available
            - action: backspace
              width: { percentage: 0.13 }
        - keys:
            - action: { keyboardType: "AiPhaBiEnglish" }
              label: "ABC"
              width: { percentage: 0.19 }
            - action: space
              width: available
              label:
                loadingText: "愛發筆"
                text: "空格"
            - action: enter
              width: { percentage: 0.19 }

    # 符號鍵盤第一頁：完全比照 iOS 內建鍵盤的 123 頁——數字、常用標點各一排，
    # 第三排是 #+=（切去第二頁）+ 幾個常用符號 + 刪除鍵，不是「仓」內建那種要
    # 先選類別的清單。標點都走 character，讓愛發筆自己的標點轉換（schema 裡
    # ascii_punct 那套）照樣生效；沒有對應轉換的符號（度數、反引號）走 symbol，
    # 直接照打、不經過 Rime——反引號尤其要這樣，不然會被萬用鍵那套字母表攔截，
    # 打不出來只會卡在候選字。
    - name: "AiPhaBiSymbols"
      rows:
        - keys:
            - action: { character: { char: "1" } }
            - action: { character: { char: "2" } }
            - action: { character: { char: "3" } }
            - action: { character: { char: "4" } }
            - action: { character: { char: "5" } }
            - action: { character: { char: "6" } }
            - action: { character: { char: "7" } }
            - action: { character: { char: "8" } }
            - action: { character: { char: "9" } }
            - action: { character: { char: "0" } }
        - keys:
            - action: { character: { char: "-" } }
            - action: { character: { char: "/" } }
            - action: { character: { char: ":" } }
            - action: { character: { char: ";" } }
            - action: { character: { char: "(" } }
            - action: { character: { char: ")" } }
            - action: { character: { char: "$" } }
            - action: { character: { char: "@" } }
            - action: { character: { char: "[" } }
              label: "「"
            - action: { character: { char: "]" } }
              label: "」"
        - keys:
            # 中間 6 顆一定要標明 width: available（不能留空）——留空的話這排
            # 會被算成「每顆都跟第一、二排一樣寬」，兩顆 0.13 的頭尾鍵一加，
            # 整排就湊不滿 100%，刪除鍵右邊會空出一截、看起來往內縮。
            - action: { keyboardType: "AiPhaBiSymbols_more" }
              label: "#+="
              width: { percentage: 0.13 }
            - action: { symbol: { char: "°" } }
              width: available
            - action: { character: { char: "," } }
              label: "，"
              width: available
            - action: { symbol: { char: "`" } }
              width: available
            - action: { character: { char: "?" } }
              label: "？"
              width: available
            - action: { character: { char: "!" } }
              label: "！"
              width: available
            - action: { character: { char: "." } }
              label: "。"
              width: available
            - action: backspace
              width: { percentage: 0.13 }
        - keys:
            - action: { keyboardType: "愛發筆26鍵" }
              label: "字母"
              width: { percentage: 0.19 }
            - action: space
              width: available
              label:
                loadingText: "愛發筆"
                text: "空格"
            - action: enter
              width: { percentage: 0.19 }

    # 符號鍵盤第二頁：比照 iOS 的 #+= 頁——比較少用、偏「原始」符號的一批
    # （方括號／大括號是真的 ASCII 版本，跟第一頁已經轉全形的「」『』不同，
    # 用 symbol 繞過 Rime，才不會被標點轉換規則攔下來變回全形）。
    - name: "AiPhaBiSymbols_more"
      rows:
        - keys:
            - action: { symbol: { char: "[" } }
            - action: { symbol: { char: "]" } }
            - action: { symbol: { char: "{" } }
            - action: { symbol: { char: "}" } }
            - action: { character: { char: "#" } }
              label: "＃"
            - action: { character: { char: "%" } }
              label: "％"
            - action: { symbol: { char: "^" } }
            - action: { character: { char: "*" } }
              label: "＊"
            - action: { character: { char: "+" } }
              label: "＋"
            - action: { character: { char: "=" } }
              label: "＝"
        - keys:
            - action: { symbol: { char: "_" } }
            - action: { symbol: { char: "—" } }
            - action: { symbol: { char: "\\" } }
            - action: { symbol: { char: "|" } }
            - action: { symbol: { char: "~" } }
            - action: { symbol: { char: "«" } }
            - action: { symbol: { char: "»" } }
            - action: { symbol: { char: "€" } }
            - action: { character: { char: "&" } }
              label: "＆"
            - action: { symbol: { char: "·" } }
        - keys:
            # 同一頁第三排，同樣的道理：中間 6 顆都要標 width: available。
            - action: { keyboardType: "AiPhaBiSymbols" }
              label: "123"
              width: { percentage: 0.13 }
            - action: { symbol: { char: "…" } }
              width: available
            - action: { character: { char: "^" } }
              label: "……"
              width: available
            - action: { character: { char: "'" } }
              label: "『’"
              width: available
            - action: { character: { char: "\"" } }
              label: "「”"
              width: available
            - action: { character: { char: "?" } }
              label: "？"
              width: available
            - action: { character: { char: "!" } }
              label: "！"
              width: available
            - action: backspace
              width: { percentage: 0.13 }
        - keys:
            - action: { keyboardType: "愛發筆26鍵" }
              label: "字母"
              width: { percentage: 0.19 }
            - action: space
              width: available
              label:
                loadingText: "愛發筆"
                text: "空格"
            - action: enter
              width: { percentage: 0.19 }
