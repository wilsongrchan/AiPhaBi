patch:
  keyboards:
    - name: "愛發筆26鍵"
      isPrimary: true
      rows:
        - keys:
            # label 給大寫字母：字根的形狀是照大寫字母設計的（Q W E…），按鍵本身仍打小寫
            # （Rime 字母表本來就是小寫，char 不能改），只是鍵面顯示改成大寫比較符合直覺。
            - action: { character: { char: q } }
              label: "Q"
            - action: { character: { char: w } }
              label: "W"
            - action: { character: { char: e } }
              label: "E"
            - action: { character: { char: r } }
              label: "R"
            - action: { character: { char: t } }
              label: "T"
            - action: { character: { char: y } }
              label: "Y"
            - action: { character: { char: u } }
              label: "U"
            - action: { character: { char: i } }
              label: "I"
            - action: { character: { char: o } }
              label: "O"
            - action: { character: { char: p } }
              label: "P"
        - keys:
            # 萬用鍵：放在 A 左邊、Q 正下方（原本這裡是空的縮排間距，現在填一顆真的鍵）。
            - action: { character: { char: "`" } }
              width: available
            - action: { character: { char: a } }
              label: "A"
            - action: { character: { char: s } }
              label: "S"
            - action: { character: { char: d } }
              label: "D"
            - action: { character: { char: f } }
              label: "F"
            - action: { character: { char: g } }
              label: "G"
            - action: { character: { char: h } }
              label: "H"
            - action: { character: { char: j } }
              label: "J"
            - action: { character: { char: k } }
              label: "K"
            - action: { character: { char: l } }
              label: "L"
        - keys:
            - action: { keyboardType: "AiPhaBiSymbols" }
              label: "符"
              width: { percentage: 0.13 }
            - action: { characterMargin: { char: z } }
              width: available
            - action: { character: { char: z } }
              label: "Z"
            - action: { character: { char: x } }
              label: "X"
            - action: { character: { char: c } }
              label: "C"
            - action: { character: { char: v } }
              label: "V"
            - action: { character: { char: b } }
              label: "B"
            - action: { character: { char: n } }
              label: "N"
            - action: { character: { char: m } }
              label: "M"
            - action: { characterMargin: { char: m } }
              width: available
            - action: backspace
              width: { percentage: 0.13 }
              swipe:
                - direction: up
                  action: { shortcutCommand: "#重输" }
        - keys:
            # 仿 iOS 的 123 鍵：跟主鍵盤上的「符」一樣切去 AiPhaBiSymbols（一頁排滿的
            # 數字符號表），不是「仓」內建的九宮格數字鍵（跟這個輸入法的定位不合——
            # 這是形碼，不是拼音，用不到九宮格）。emoji 鍵沒加：翻過「仓」原始碼，
            # emoji 鍵盤那塊目前是空的 TODO（只畫一塊紅色空白），加了也打不出表情。
            - action: { keyboardType: "AiPhaBiSymbols" }
              label: "123"
              width: { percentage: 0.19 }
            - action: space
              width: available
              label:
                loadingText: "愛發筆"
                text: "空格"
            - action: { character: { char: "," } }
              label: "，"
              swipe:
                - direction: up
                  action: { character: { char: "." } }
                  label: "。"
                  display: true
            - action: { keyboardType: alphabetic }
              width: { percentage: 0.13 }
            - action: enter
              width: { percentage: 0.19 }

    # 符號鍵盤：仿 iOS 內建注音／拼音鍵盤的數字符號頁 —— 一頁排滿、不用像「仓」內建的
    # 分類符號鍵盤那樣先選類別再找。標點都走 character，讓愛發筆自己的標點轉換
    # （schema 裡 ascii_punct 那套）照樣生效，跟主鍵盤上的逗號句號用同一套規則。
    - name: "AiPhaBiSymbols"
      rows:
        - keys:
            - action: { character: { char: "1" } }
            - action: { character: { char: "2" } }
            - action: { character: { char: "3" } }
            - action: { character: { char: "4" } }
            - action: { character: { char: "5" } }
            - action: { character: { char: "6" } }
            - action: { character: { char: "7" } }
            - action: { character: { char: "8" } }
            - action: { character: { char: "9" } }
            - action: { character: { char: "0" } }
        - keys:
            - action: { character: { char: "-" } }
            - action: { character: { char: "/" } }
            - action: { character: { char: ":" } }
            - action: { character: { char: ";" } }
            - action: { character: { char: "(" } }
            - action: { character: { char: ")" } }
            - action: { character: { char: "$" } }
            - action: { character: { char: "@" } }
            - action: { character: { char: "[" } }
              label: "「"
            - action: { character: { char: "]" } }
              label: "」"
        - keys:
            - action: { character: { char: "#" } }
            - action: { character: { char: "%" } }
            - action: { character: { char: "&" } }
            - action: { character: { char: "*" } }
            - action: { character: { char: "+" } }
            - action: { character: { char: "=" } }
            - action: { character: { char: "{" } }
              label: "『"
            - action: { character: { char: "}" } }
              label: "』"
            - action: { character: { char: "_" } }
            - action: backspace
              width: { percentage: 0.13 }
        - keys:
            - action: { keyboardType: "愛發筆26鍵" }
              label: "字母"
              width: { percentage: 0.19 }
            - action: space
              width: available
              label:
                loadingText: "愛發筆"
                text: "空格"
            - action: { character: { char: "," } }
              label: "，"
              swipe:
                - direction: up
                  action: { character: { char: "." } }
                  label: "。"
                  display: true
            - action: { keyboardType: "AiPhaBiSymbols_more" }
              label: "更多"
              width: { percentage: 0.13 }
            - action: enter
              width: { percentage: 0.19 }

    # 第二頁符號：《》～……—— 等較少用、第一頁放不下的。
    - name: "AiPhaBiSymbols_more"
      rows:
        - keys:
            - action: { character: { char: "<" } }
              label: "《"
            - action: { character: { char: ">" } }
              label: "》"
            - action: { character: { char: "~" } }
            - action: { character: { char: "^" } }
              label: "……"
            - action: { character: { char: "|" } }
            - action: { character: { char: "!" } }
              label: "！"
            - action: { character: { char: "?" } }
              label: "？"
            - action: { character: { char: "." } }
              label: "。"
            - action: { character: { char: "\\" } }
              label: "、"
        - keys:
            - action: { keyboardType: "AiPhaBiSymbols" }
              label: "返回"
              width: { percentage: 0.19 }
            - action: space
              width: available
              label:
                loadingText: "愛發筆"
                text: "空格"
            - action: { keyboardType: "愛發筆26鍵" }
              label: "字母"
              width: { percentage: 0.19 }
            - action: enter
              width: { percentage: 0.19 }
