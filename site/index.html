<body class="lg-body">
<!-- 導覽先躲在左邊，等拆件動畫播完一輪才滑出來（見 landing.js 的 revealNav）。
     ⚠️ 這段一定要**同步、在第一次繪製之前**跑，所以寫在這裡而不是放進 landing.js：
     landing.js 要等 fetch 回來才動作，那時畫面已經畫過一輪，使用者會看到側邊欄
     先出現、再滑出去、最後又滑回來。在這裡加 class 的話，第一次繪製時它就已經
     在左邊了，CSS 過渡也不會對「初始狀態」動畫，所以只有最後滑進來那一下會動。
     ⚠️ 保險計時器也放這裡：就算 landing.js 整個載入失敗，30 秒後導覽一定回來。 -->
<script>
(function () {
  var m = window.matchMedia;
  if (!m) return;                                     // 太舊的瀏覽器就別玩花樣
  /* 「減少動態效果」開著就不藏導覽 —— 沒有飛行動畫可看，藏起來只是徒然。
     除非他自己按過「播放完整動畫」（landing.js 記在 sessionStorage 的同一個
     鍵），那就照完整版走。 */
  var okd = false;
  try { okd = window.sessionStorage.getItem('aiphabi-lg-motion') === '1'; } catch (e) {}
  if (!okd && m('(prefers-reduced-motion: reduce)').matches) return;
  /* ⚠️ 這裡原本有一條 `if (m('(max-width: 52rem)').matches) return;` —— 窄螢幕
     不玩這個。那時候手機版的導覽是**三行**橫排（225px，最多 542px），藏起來
     又滑回來整頁會跳一大段。2026-09-02 導覽收成漢堡選單之後只剩一列 59px，
     而且是往上滑走、位置留著不重排，所以窄螢幕也照做（Wilson）。 */
  document.body.classList.add('lg-navhide');
  window.setTimeout(function () {
    document.body.classList.remove('lg-navhide');
  }, 30000);
})();
</script>

<main class="wrap">

  <!-- 首頁不是〈簡介〉那篇文件頁，是獨立的入口——2026-08-30 依 Wilson 指示改版：
       新訪客什麼都不懂，第一眼要看到「打字會變成中文字」這件事本身，不是九點
       特色清單。原本的文件內容整篇搬去 jieshao.html，側邊欄的「簡介」現在連過去。
       這裡只留品牌名、幾個關鍵詞、一段拆件動畫、跟一顆按鈕。 -->
  <section class="hero--landing">
    <div class="hero-bg" aria-hidden="true"></div>
    <p class="hero-kicker">中文字形輸入法</p>
    <h1 class="hero-title">愛發筆 <span class="en" data-keep>AiPhaBi</span></h1>
    <p class="hero-tagline">發掘中文打字的樂趣</p>

    <!-- 這個位置先播一輪拆件動畫（哈／竹／昌／石各播一次：字母先登場、飛到
         定點、淡出換成真正的筆畫，逐字根疊出整個字），播完原地換成「猜猜看」
         小遊戲——同一個位置，不是切去另一個區塊。見 assets/landing.js。 -->
    <div class="lg-box">
      <!-- 跳過動畫，直接看猜猜看（見 assets/landing.js 的 showGuess()）——
           只有圖示不寫字（Wilson），疊在重播圖示正上方。 -->
      <button type="button" class="lg-skip" id="lg-skip" aria-label="跳過動畫，直接看猜猜看">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        <span class="lg-tip" aria-hidden="true">跳過動畫</span>
      </button>
      <!-- 重播圖示——不管現在是動畫還是猜猜看階段都看得到，按了就從頭重播
           動畫（見 assets/landing.js 的 restart()）。位置貼著範例字的高度
           置中，不是釘死在角落（Wilson）。 -->
      <button type="button" class="lg-restart" id="lg-restart" aria-label="重新播放拆件動畫">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        <span class="lg-tip" aria-hidden="true">重播動畫</span>
      </button>
      <div class="lg-stage" id="lg-stage">
        <svg id="lg-svg" class="lg-svg" viewBox="-650 0 2324 1024" aria-hidden="true"></svg>
      </div>
      <p class="lg-code" id="lg-code" aria-live="polite"></p>

      <!-- 猜猜看：動畫播完才會出現（見 assets/landing.js 尾端）。答案不是寫死
           在 HTML／JS 裡的——開頁就去查 dict.json 真正的碼表，碼表換了這裡
           自動跟著換。字形跟上面拆件動畫同一種（真正的筆畫，不是系統字型），
           田字格也是全站共用的那個 .tianzi（見 assets/glyphbox.js）。 -->
      <div class="guess" id="guess" hidden>
        <div id="guess-play">
          <p class="guess-label">猜猜看，這個字怎麼打？</p>
          <div class="tianzi" id="guess-tianzi"></div>
          <label class="sr-only" for="guess-input">猜猜看要打哪幾個字母</label>
          <!-- ⚠️ 這個框**不掛 data-keep**：掛了的話連 placeholder 都不會被轉成简體
               （「在這裡輸入英文字母」會一直是繁體，Wilson 2026-09-02 抓到）。
               跟〈字根表〉查字框同一個坑，見那邊的說明與 d14f477。框裡沒有文字
               節點，使用者打進去的字母本來就不會被轉換器碰到。 -->
          <input type="text" id="guess-input" class="guess-input" maxlength="5" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="在這裡輸入英文字母">
          <div class="guess-actions">
            <button type="button" id="guess-check" class="btn btn-ghost">看答案</button>
            <button type="button" id="guess-next" class="guess-next" hidden>換一個字</button>
          </div>
          <p class="guess-answer" id="guess-answer" aria-live="polite"></p>
        </div>

        <!-- 四個字都玩過（猜對、猜錯、跳過都算）之後，田字格那一整塊換成這個 ——
             一步一步把人帶到下一個可以動手的地方（Wilson 2026-09-01）。
             只留一句反問＋按鈕，不講「四個字都玩過了」那種結算式的話
             （Wilson 2026-09-01：拿掉標題跟說明句）。 -->
        <div class="guess-done" id="guess-done" hidden>
          <p class="guess-done-invite">想體驗更多？</p>
          <a class="btn btn-primary" href="lianxi.html">馬上學習更多字根</a>
        </div>
      </div>
    </div>

    <p class="hero-keywords">
      <span>字根取形於英文字母</span><span class="dot">·</span><span>免記鍵位</span><span class="dot">·</span><span>字根單編碼</span><span class="dot">·</span><span>26鍵</span><span class="dot">·</span><span>常用字低重碼</span>
    </p>
    <!-- 兩顆按鈕：先講「這是什麼」，再給一條自己動手的路。第二顆接的是
         〈字根練習〉——上面那段拆件動畫看完只是看過，字根練習是同一件事讓人
         自己答一遍（Wilson 2026-09-01）。
         ⚠️ 「我想學習更多字根」這顆四個字都玩過、上面的 #guess-done 冒出來
         之後會被 landing.js 藏掉——兩顆都連去 lianxi.html，#guess-done 自己
         也有一顆「馬上學習更多字根」，兩顆擠在同一屏會像貼錯的複本
         （Wilson 抓到）。id 是特地加的，讓 landing.js 找得到它。 -->
    <div class="hero-cta">
      <a class="btn btn-primary" href="jieshao.html">自己發掘</a>
      <a class="btn btn-ghost" id="hero-lianxi-cta" href="lianxi.html">我想學習更多字根</a>
    </div>
  </section>
