<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>愛發筆 AiPhaBi · 字根取形於英文字母的中文輸入法</title>
<meta name="description" content="愛發筆輸入法是一款全新的中文字形輸入法。其最大的特點是所有的字根都直接取形於英文字母本身，這代表無需特定的中文鍵盤就可以使用愛發筆，也無需硬背字根在鍵盤上的位置。">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">愛發筆<span class="en" data-keep>AiPhaBi</span></a>
    <div class="topbar-controls">
      <div class="langtoggle" role="group" aria-label="字體切換">
        <button type="button" data-lang="trad" aria-pressed="true" data-keep>繁</button>
        <button type="button" data-lang="simp" aria-pressed="false" data-keep>简</button>
      </div>

      <div class="zg-size" role="group" aria-label="字級">
        <span>字級</span>
        <div class="zg-size-btns">
          <button type="button" data-size="small" aria-pressed="false">小</button>
          <button type="button" data-size="normal" aria-pressed="true">中</button>
          <button type="button" data-size="large" aria-pressed="false">大</button>
        </div>
      </div>
    </div>
    <nav class="site">
      <a href="jieshao.html">簡介</a>
      <div class="nav-sec">
        <span class="nav-sec-t">基礎學習</span>
        <a href="zigen.html">字根表</a>
        <a href="principles.html">取碼原則</a>
        <a href="conventional.html">約定字表</a>
        <a href="jianma.html">簡碼</a>
      </div>
      <div class="nav-sec">
        <span class="nav-sec-t">流暢模式</span>
        <a href="cizu.html">詞組連打</a>
        <a href="dingping.html">自動上屏</a>
      </div>
      <div class="nav-sec">
        <span class="nav-sec-t">體驗工具</span>
        <a href="try.html">線上試打</a>
        <a href="chaima.html">拆碼查詢</a>
      </div>
      <a href="houji.html">後記</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- 首頁不是〈簡介〉那篇文件頁，是獨立的入口——2026-08-30 依 Wilson 指示改版：
       新訪客什麼都不懂，第一眼要看到「打字會變成中文字」這件事本身，不是九點
       特色清單。原本的文件內容整篇搬去 jieshao.html，側邊欄的「簡介」現在連過去。
       這裡只留品牌名、幾個關鍵詞、一段拆件動畫、跟兩顆按鈕。 -->
  <section class="hero--landing">
    <div class="hero-bg" aria-hidden="true"></div>
    <p class="hero-kicker">中文字形輸入法</p>
    <h1 class="hero-title">愛發筆 <span class="en" data-keep>AiPhaBi</span></h1>

    <!-- 拆件動畫：字根字母炸開、上色、飛回原位組成字，輪流播哈／竹／晶三個字。
         由 assets/landing.js 接 assets/landing-glyphs.json 畫出來；沒有 JS
         就是空的，不影響下面按鈕跟查詢框。 -->
    <div class="lg-stage">
      <svg id="lg-svg" viewBox="0 0 1024 1024" aria-hidden="true"></svg>
    </div>
    <p class="lg-code" id="lg-code" aria-live="polite"></p>

    <p class="hero-keywords">
      <span>字根即字母形狀</span><span class="dot">·</span><span>免記鍵位</span><span class="dot">·</span><span>低重碼</span>
    </p>
    <div class="hero-cta">
      <a class="btn btn-primary" href="try.html">立即試打</a>
      <a class="btn btn-ghost" href="jieshao.html">深入了解</a>
    </div>
  </section>

  <section class="landing-demo">
    <p class="landing-demo-label">打打看——自己打字母，看看變成哪個字</p>
    <div class="landing-demo-box">
      <label class="sr-only" for="ld-input">試打框根字母</label>
      <input type="text" id="ld-input" maxlength="5" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" data-keep>
      <div class="landing-demo-out" id="ld-out" aria-live="polite"></div>
    </div>
    <p class="landing-demo-hint">任何字母組合都查得到；想練真正打字，見<a href="try.html">線上試打</a>。</p>
    <noscript><p class="landing-demo-hint">這個小工具需要 JavaScript 才查得到字。</p></noscript>
  </section>

</main>


<footer class="wrap">
  <p>© 2026 愛發筆輸入法 <span data-keep>AiPhaBi</span>　版權所有
    <span class="en-note" data-keep>All Rights Reserved</span></p>
</footer>

<script src="assets/site.js"></script>
<script src="assets/landing.js"></script>
</body>
</html>
