<script>
(function () {
  var btns = document.querySelectorAll('.pdf-switch button');
  var panels = document.querySelectorAll('[data-pdf-panel]');
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      var want = b.dataset.pdf;
      btns.forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      panels.forEach(function (p) { p.hidden = p.dataset.pdfPanel !== want; });
    });
  });
})();
</script>
