  <h1>約定字表</h1>

  <p class="lede">
    絕大部分的字都按筆順逐一拆碼，但少數字形這樣拆會違反其他原則（例如孤筆略過、
    能合不分），所以另外約定一個固定的碼，不必每次重新拆——見
