<main class="wrap cm-page doc-prose">

  <p class="eyebrow">愛發筆輸入法</p>
  <h1>拆碼查詢</h1>

  <p class="lede">想知道某一個字怎麼打，在這裡查。知道讀音就打拼音；手上已經有字了，就把它——或者一整句話——貼進<span class="cm-where-wide">右邊</span><span class="cm-where-narrow">下面</span>的框。</p>

  <div class="cm-panel">
    <div class="cm-inputs">
      <div class="cm-field">
        <label for="cm-py-input">字音查碼</label>
        <!-- 拼音／注音二選一，跟〈線上試打〉的拼音查字同一套（assets/bpmf.js
             共用，不要抄，見那支檔案開頭的說明）。 -->
        <div class="jm-sortbar-btns pyq-mode-btns">
          <button type="button" data-pyq-mode="pinyin" aria-pressed="true">拼音</button>
          <button type="button" data-pyq-mode="zhuyin" aria-pressed="false">注音</button>
        </div>
        <input type="text" id="cm-py-input" class="cm-in" placeholder="例如：bai 或 bairi"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="pyq-bpmf" id="cm-bpmf" hidden></div>
      </div>
      <div class="cm-field cm-field-wide">
        <label for="cm-tx-input">貼字查碼</label>
        <textarea id="cm-tx-input" class="cm-in" rows="2"
                  placeholder="例如：白日依山盡"
                  autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- 顯示選項。三個都只改「看起來怎樣」，不改查到的是哪些字 —— 所以放在
         面板底部、輸入框下面，不要擺在輸入框上面搶戲。選擇記在 localStorage。 -->
    <div class="cm-opts">
      <div class="short-toggle" role="radiogroup" aria-label="拆碼圖大小">
        <span>大小</span>
        <label class="chk-toggle"><input type="radio" name="cmsize" data-cmsize="lg">大</label>
        <label class="chk-toggle"><input type="radio" name="cmsize" data-cmsize="md" checked>中</label>
        <label class="chk-toggle"><input type="radio" name="cmsize" data-cmsize="sm">小</label>
      </div>
      <div class="short-toggle">
        <span>套用簡碼</span>
        <label class="chk-toggle"><input type="checkbox" id="cm-conv">約定簡碼</label>
        <label class="chk-toggle"><input type="checkbox" id="cm-short3">三簡碼</label>
      </div>
      <!-- 拆碼圖排在字根顏色前面：顏色是它的附屬選項（拆碼圖關掉，顏色跟著
           停用），先出現的那個才是管事的那個。 -->
      <div class="short-toggle">
        <span>顯示</span>
        <label class="chk-toggle"><input type="checkbox" id="cm-grid" checked>拆碼圖</label>
        <label class="chk-toggle"><input type="checkbox" id="cm-colour" checked>字根顏色</label>
      </div>
    </div>
  </div>

  <div class="cm-wall is-md" id="cm-wall"></div>
  <p class="cm-note" id="cm-note" aria-live="polite"></p>
